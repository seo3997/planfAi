<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 등록 - planF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/admin/js/admin_common.js"></script>
    <link href="/admin/css/admin_style.css" rel="stylesheet">
    <style>
        .form-section { background: #fff; border: 1px solid #dee2e6; padding: 0; margin-bottom: 30px; }
        .section-title { padding: 15px 20px; font-size: 16px; font-weight: 600; color: #2b4c80; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
        .form-table { width: 100%; border-collapse: collapse; }
        .form-table th { width: 150px; background: #f8f9fa; padding: 15px 20px; font-weight: 500; font-size: 14px; text-align: left; border-bottom: 1px solid #eee; border-right: 1px solid #eee; }
        .form-table td { padding: 12px 20px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="app">
        <admin-header></admin-header>

        <div class="main-container">
            <admin-sidebar></admin-sidebar>

            <main class="content">
                <div class="page-header d-flex justify-content-between align-items-center">
                    <h2>게시판 등록</h2>
                    <div class="breadcrumb">
                        <i class="bi bi-house-door-fill"></i> > 게시판 > <strong>게시판</strong>
                    </div>
                </div>

                <div class="form-container" style="background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.05);">
                    <div class="section-header mb-3">
                        <span style="color: #3668af; margin-right: 5px;">■</span><strong>기본정보</strong>
                    </div>
                    <table class="table table-bordered">
                        <tbody>
                            <tr>
                                <th style="width: 180px; background-color: #f8f9fa;">게시판구분</th>
                                <td>
                                    <select class="form-select w-100" v-model="board.bbs_se_code_m">
                                        <option value="">유형 선택</option>
                                        <option v-for="item in categoryCodes" :key="item.CODE" :value="item.CODE">
                                            {{ item.CODE_NM }}
                                        </option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">제목</th>
                                <td>
                                    <input type="text" class="form-control" v-model="board.sj" placeholder="제목을 입력하세요">
                                </td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">내용</th>
                                <td>
                                    <textarea class="form-control" v-model="board.cn" rows="10" placeholder="내용을 입력하세요"></textarea>
                                </td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">첨부파일</th>
                                <td>
                                    <div class="d-flex gap-2 align-items-center">
                                        <select class="form-select" style="width: 150px;">
                                            <option value="1">1</option>
                                        </select>
                                        <input type="file" class="form-control" multiple @change="onFileChange">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">첨부파일 표시여부</th>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" v-model="board.atch_yn" value="Y" id="atchY" checked>
                                            <label class="form-check-label" for="atchY">다운로드</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" v-model="board.atch_yn" value="N" id="atchN">
                                            <label class="form-check-label" for="atchN">화면표시</label>
                                        </div>
                                        <span class="small text-muted ms-3">※ 화면표시 체크 시 확장자는 이미지일 경우 소문자 jpg/png/gif/bmp, 동영상일 경우 소문자 mp4로 업로드해주시기 바랍니다.</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button class="btn border" style="background: #fff; color: #333;" @click="goList">
                            <i class="bi bi-reply-fill"></i> 목록
                        </button>
                        <button class="btn" style="background-color: #21457f; color: #fff;" @click="saveBoard">
                            <i class="bi bi-pencil-fill"></i> 등록
                        </button>
                    </div>
                </div>

                <admin-footer></admin-footer>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const app = createApp({
            setup() {
                const categoryCodes = ref([]);
                const board = ref({
                    bbs_se_code_m: '',
                    sj: '',
                    cn: '',
                    atch_yn: 'Y'
                });
                const selectedFiles = ref([]);

                const fetchCategories = async () => {
                    categoryCodes.value = await AdminCode.getCodes('R010170');
                };

                const onFileChange = (e) => {
                    selectedFiles.value = Array.from(e.target.files);
                };

                const formatSize = (bytes) => {
                    if (bytes === 0) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                };

                const saveBoard = () => {
                    if (!board.value.bbs_se_code_m) return alert('게시판 유형을 선택하세요.');
                    if (!board.value.sj) return alert('제목을 입력하세요.');

                    const formData = new FormData();
                    formData.append('bbs_se_code_m', board.value.bbs_se_code_m);
                    formData.append('sj', board.value.sj);
                    formData.append('cn', board.value.cn);
                    formData.append('atch_yn', board.value.atch_yn);
                    
                    selectedFiles.value.forEach(file => {
                        formData.append('files', file);
                    });

                    axios.post('/api/admin/mgt/board', formData, {
                        headers: { 'Content-Type': 'multipart/form-data' }
                    }).then(() => {
                        alert('게시글이 등록되었습니다.');
                        goList();
                    }).catch(err => alert('오류: ' + err.response.data));
                };

                const goList = () => {
                    location.href = '/admin/mgt/mboard/selectPageListBoard.do';
                };

                onMounted(() => {
                    AdminMenu.init();
                    fetchCategories();
                });

                return { categoryCodes, board, selectedFiles, onFileChange, formatSize, saveBoard, goList };
            }
        });
        AdminLayout.register(app);
        app.mount('#app');
    </script>
</body>
</html>
