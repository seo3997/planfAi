<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 등록 - planF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/admin/js/admin_common.js"></script>
    <link href="/admin/css/admin_style.css" rel="stylesheet">
    <style>
        .form-section { background: #fff; border: 1px solid #dee2e6; padding: 0; margin-bottom: 30px; }
        .section-title { padding: 15px 20px; font-size: 16px; font-weight: 600; color: #2b4c80; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
        .form-table { width: 100%; border-collapse: collapse; }
        .form-table th { width: 200px; background: #f8f9fa; padding: 12px 25px; font-weight: 500; font-size: 14px; text-align: left; border-bottom: 1px solid #eee; border-right: 1px solid #eee; }
        .form-table td { padding: 10px 25px; border-bottom: 1px solid #eee; }
        .form-control, .form-select { border-radius: 0; border: 1px solid #ced4da; }
        .btn-list { background-color: #6c757d; color: white; border: none; padding: 8px 20px; border-radius: 4px; }
        .btn-submit { background-color: #2b4c80; color: white; border: none; padding: 8px 25px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <admin-header></admin-header>

        <div class="main-container">
            <admin-sidebar></admin-sidebar>

            <main class="content">
                <div class="page-title-box">
                    <h2 class="page-title">게시판 등록</h2>
                    <div class="breadcrumb-area">
                        <i class="bi bi-house-door text-muted"></i> > 게시판 > <span class="text-primary fw-medium">게시판</span>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">
                        <i class="bi bi-caret-right-fill text-primary"></i> 게시글 정보 입력
                    </div>
                    <table class="form-table">
                        <tr>
                            <th class="required">게시판 구분</th>
                            <td>
                                <select class="form-select" v-model="board.bbs_se_code_m" style="width: 350px;">
                                    <option value="">유형 선택</option>
                                    <option v-for="item in categoryCodes" :key="item.CODE" :value="item.CODE">
                                        {{ item.CODE_NM }}
                                    </option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th class="required">제목</th>
                            <td>
                                <input type="text" class="form-control" v-model="board.sj" placeholder="제목을 입력하세요">
                            </td>
                        </tr>
                        <tr>
                            <th class="required">내용</th>
                            <td>
                                <textarea class="form-control" v-model="board.cn" rows="12" placeholder="내용을 입력하세요"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <th>첨부파일</th>
                            <td>
                                <div class="d-flex gap-2 align-items-center">
                                    <input type="file" class="form-control" multiple @change="onFileChange" style="width: 500px;">
                                    <span class="text-muted small">* 여러 파일을 선택할 수 있습니다.</span>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <th>첨부파일 표시여부</th>
                            <td>
                                <div class="d-flex align-items-center gap-3 py-1">
                                    <div class="form-check m-0">
                                        <input class="form-check-input" type="radio" v-model="board.atch_yn" value="Y" id="atchY">
                                        <label class="form-check-label" for="atchY">다운로드</label>
                                    </div>
                                    <div class="form-check m-0">
                                        <input class="form-check-input" type="radio" v-model="board.atch_yn" value="N" id="atchN">
                                        <label class="form-check-label" for="atchN">화면표시</label>
                                    </div>
                                    <span class="small text-muted ms-3">※ 화면표시 체크 시 이미지(jpg, png 등)나 mp4 동영상이 본문에 표시됩니다.</span>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-4 mb-5">
                    <button class="btn btn-list" @click="goList"><i class="bi bi-reply"></i> 목록</button>
                    <button class="btn btn-submit" @click="saveBoard">등록</button>
                </div>

                <admin-footer></admin-footer>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const app = createApp({
            setup() {
                const categoryCodes = ref([]);
                const board = ref({
                    bbs_se_code_m: '',
                    sj: '',
                    cn: '',
                    atch_yn: 'Y'
                });
                const selectedFiles = ref([]);

                const fetchCategories = async () => {
                    categoryCodes.value = await AdminCode.getCodes('R010170');
                };

                const onFileChange = (e) => {
                    selectedFiles.value = Array.from(e.target.files);
                };

                const saveBoard = () => {
                    if (!board.value.bbs_se_code_m) return alert('게시판 유형을 선택하세요.');
                    if (!board.value.sj) return alert('제목을 입력하세요.');
                    if (!board.value.cn) return alert('내용을 입력하세요.');

                    const formData = new FormData();
                    formData.append('bbs_se_code_m', board.value.bbs_se_code_m);
                    formData.append('sj', board.value.sj);
                    formData.append('cn', board.value.cn);
                    formData.append('atch_yn', board.value.atch_yn);
                    
                    selectedFiles.value.forEach(file => {
                        formData.append('files', file);
                    });

                    axios.post('/api/admin/mgt/board', formData, {
                        headers: { 'Content-Type': 'multipart/form-data' }
                    }).then(() => {
                        alert('게시글이 등록되었습니다.');
                        goList();
                    }).catch(err => alert('등록 중 오류 발생'));
                };

                const goList = () => {
                    location.href = '/admin/mgt/mboard/selectPageListBoard.do';
                };

                onMounted(() => {
                    AdminMenu.init();
                    fetchCategories();
                });

                return { categoryCodes, board, selectedFiles, onFileChange, saveBoard, goList };
            }
        });
        AdminLayout.register(app);
        app.mount('#app');
    </script>
</body>
</html>
