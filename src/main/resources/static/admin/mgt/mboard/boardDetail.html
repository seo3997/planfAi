<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 - planF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/admin/js/admin_common.js"></script>
    <link href="/admin/css/admin_style.css" rel="stylesheet">
    <style>
        .form-section { background: #fff; border: 1px solid #dee2e6; padding: 0; margin-bottom: 30px; }
        .section-title { padding: 15px 20px; font-size: 16px; font-weight: 600; color: #2b4c80; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
        .info-table { width: 100%; border-collapse: collapse; }
        .info-table th { width: 200px; background: #f8f9fa; padding: 20px 25px; font-weight: 500; font-size: 14px; text-align: left; border-bottom: 1px solid #eee; border-right: 1px solid #eee; }
        .info-table td { padding: 20px 25px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
        .content-area { min-height: 250px; white-space: pre-wrap; word-break: break-all; }
        .btn-list { background-color: #6c757d; color: white; border: none; padding: 8px 20px; border-radius: 4px; }
        .btn-edit { background-color: #31c4b6; color: white; border: none; padding: 8px 20px; border-radius: 4px; }
        .btn-delete { background-color: #ed5f39; color: white; border: none; padding: 8px 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <admin-header></admin-header>

        <div class="main-container">
            <admin-sidebar></admin-sidebar>

            <main class="content">
                <div class="page-title-box">
                    <h2 class="page-title">게시판 상세</h2>
                    <div class="breadcrumb-area">
                        <i class="bi bi-house-door text-muted"></i> > 게시판 > <span class="text-primary fw-medium">게시판</span>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">
                        <i class="bi bi-caret-right-fill text-primary"></i> 게시글 상세 정보
                    </div>
                    <table class="info-table">
                        <tr>
                            <th>게시판 구분</th>
                            <td>{{ board.BBS_SE_NM }}</td>
                            <th>등록일시</th>
                            <td>{{ formatDate(board.REGIST_DT) }}</td>
                        </tr>
                        <tr>
                            <th>제목</th>
                            <td colspan="3">{{ board.SJ }}</td>
                        </tr>
                        <tr>
                            <th>등록자명</th>
                            <td>{{ board.REGISTER_NM }}</td>
                            <th>등록자ID</th>
                            <td>{{ board.REGISTER_ID }}</td>
                        </tr>
                        <tr>
                            <th style="vertical-align: top;">내용</th>
                            <td colspan="3">
                                <div class="content-area">{{ board.CN }}</div>
                                <div v-if="imageFiles.length > 0" class="mt-4 pt-3 border-top">
                                    <div v-for="file in imageFiles" :key="file.FILE_ID">
                                        <img :src="'/common/img/board/' + file.FILE_ID" style="max-width: 100%; margin-bottom: 15px; border: 1px solid #eee;" />
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-4 mb-5">
                    <button class="btn btn-list" @click="goList"><i class="bi bi-reply"></i> 목록</button>
                    <button class="btn btn-edit" @click="goUpdate"><i class="bi bi-pencil-square"></i> 수정</button>
                    <button class="btn btn-delete" @click="deleteBoard"><i class="bi bi-trash"></i> 삭제</button>
                </div>

                <admin-footer></admin-footer>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed } = Vue;

        const app = createApp({
            setup() {
                const board = ref({
                    fileList: []
                });
                const params = new URLSearchParams(window.location.search);
                const bbsSeq = params.get('bbs_seq');

                const fetchBoardDetail = () => {
                    if(!bbsSeq) return;
                    axios.get(`/api/admin/mgt/board/${bbsSeq}`)
                        .then(res => board.value = res.data);
                };

                const imageFiles = computed(() => {
                    if (!board.value.fileList) return [];
                    const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp'];
                    return board.value.fileList.filter(f => {
                        const ext = f.FILE_EXTSN_NM ? f.FILE_EXTSN_NM.toLowerCase() : '';
                        return imgExts.includes(ext);
                    });
                });

                const formatDate = (dt) => {
                    if (!dt) return '';
                    return dt.split(' ')[0].replace(/-/g, '.');
                };

                const goList = () => {
                    location.href = '/admin/mgt/mboard/selectPageListBoard.do';
                };

                const goUpdate = () => {
                    location.href = `/admin/mgt/mboard/updateFormBoard.do?bbs_seq=${bbsSeq}`;
                };

                const deleteBoard = () => {
                    if (confirm('정말 삭제하시겠습니까?')) {
                        axios.delete(`/api/admin/mgt/board/${bbsSeq}`)
                            .then(() => {
                                alert('삭제되었습니다.');
                                goList();
                            });
                    }
                };

                onMounted(() => {
                    AdminMenu.init();
                    fetchBoardDetail();
                });

                return { board, imageFiles, goList, goUpdate, deleteBoard, formatDate };
            }
        });
        AdminLayout.register(app);
        app.mount('#app');
    </script>
</body>
</html>
