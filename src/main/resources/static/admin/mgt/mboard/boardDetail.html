<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세 - planF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/admin/js/admin_common.js"></script>
    <link href="/admin/css/admin_style.css" rel="stylesheet">
    <style>
        .form-section { background: #fff; border: 1px solid #dee2e6; padding: 0; margin-bottom: 30px; }
        .section-title { padding: 15px 20px; font-size: 16px; font-weight: 600; color: #2b4c80; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
        .info-table { width: 100%; border-collapse: collapse; }
        .info-table th { width: 150px; background: #f8f9fa; padding: 15px 20px; font-weight: 500; font-size: 14px; text-align: left; border-bottom: 1px solid #eee; border-right: 1px solid #eee; }
        .info-table td { padding: 15px 20px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
        .content-area { min-height: 200px; white-space: pre-wrap; word-break: break-all; }
        .file-list { margin-top: 10px; }
        .file-item { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .img-preview { max-width: 500px; margin-top: 20px; border: 1px solid #eee; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <admin-header></admin-header>

        <div class="main-container">
            <admin-sidebar></admin-sidebar>

            <main class="content">
                <div class="page-header d-flex justify-content-between align-items-center">
                    <h2>게시판 상세</h2>
                    <div class="breadcrumb">
                        <i class="bi bi-house-door-fill"></i> > 게시판 > <strong>게시판</strong>
                    </div>
                </div>

                <div class="detail-container" style="background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.05);">
                    <table class="table table-bordered">
                        <tbody>
                            <tr>
                                <th style="width: 180px; background-color: #f8f9fa;">게시판구분</th>
                                <td>{{ board.BBS_SE_NM }}</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">제목</th>
                                <td>{{ board.SJ }}</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">등록자명</th>
                                <td style="width: 35%;">{{ board.REGISTER_NM }}</td>
                                <th style="width: 180px; background-color: #f8f9fa;">등록자ID</th>
                                <td>{{ board.REGISTER_ID }}</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">등록일시</th>
                                <td colspan="3">{{ board.REGIST_DT }}</td>
                            </tr>
                            <tr>
                                <th style="background-color: #f8f9fa;">내용</th>
                                <td colspan="3" style="height: 300px; vertical-align: top;">
                                    <div class="content-area">{{ board.CN }}</div>
                                    <div v-if="board.ATCH_YN === 'N'" class="mt-3">
                                        <div v-for="file in imageFiles" :key="file.FILE_ID">
                                            <img :src="'/common/img/board/' + file.FILE_ID + '.' + file.FILE_EXTSN_NM" style="max-width: 100%; margin-bottom: 10px;" />
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button class="btn border" style="background: #fff; color: #333;" @click="goList">
                            <i class="bi bi-reply-fill"></i> 목록
                        </button>
                        <button class="btn" style="background-color: #29beb1; color: #fff;" @click="goUpdate">
                            <i class="bi bi-pencil-fill"></i> 수정
                        </button>
                        <button class="btn" style="background-color: #ed5f39; color: #fff;" @click="deleteBoard">
                            <i class="bi bi-trash-fill"></i> 삭제
                        </button>
                    </div>
                </div>

                <admin-footer></admin-footer>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed } = Vue;

        const app = createApp({
            setup() {
                const board = ref({
                    fileList: []
                });
                const params = new URLSearchParams(window.location.search);
                const bbsSeq = params.get('bbs_seq');

                const fetchBoardDetail = () => {
                    axios.get(`/api/admin/mgt/board/${bbsSeq}`)
                        .then(res => board.value = res.data);
                };

                const imageFiles = computed(() => {
                    if (!board.value.fileList) return [];
                    const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp'];
                    return board.value.fileList.filter(f => imgExts.includes(f.FILE_EXTSN_NM.toLowerCase()));
                });

                const formatSize = (bytes) => {
                    if (!bytes) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                };

                const goList = () => {
                    location.href = '/admin/mgt/mboard/selectPageListBoard.do';
                };

                const goUpdate = () => {
                    location.href = `/admin/mgt/mboard/updateFormBoard.do?bbs_seq=${bbsSeq}`;
                };

                const deleteBoard = () => {
                    if (confirm('정말 삭제하시겠습니까?')) {
                        axios.delete(`/api/admin/mgt/board/${bbsSeq}`)
                            .then(() => {
                                alert('삭제되었습니다.');
                                goList();
                            });
                    }
                };

                onMounted(() => {
                    AdminMenu.init();
                    fetchBoardDetail();
                });

                return { board, imageFiles, formatSize, goList, goUpdate, deleteBoard };
            }
        });
        AdminLayout.register(app);
        app.mount('#app');
    </script>
</body>
</html>
