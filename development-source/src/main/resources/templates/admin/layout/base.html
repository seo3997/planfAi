<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, script, head)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">관리자 - PlanfAi</title>
    
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-vue-next@0.15.2/dist/bootstrap-vue-next.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/admin/css/admin_style.css" rel="stylesheet">
    
    <!-- JS -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vueuse/shared@10.9.0/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vueuse/core@10.9.0/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-vue-next@0.15.2/dist/bootstrap-vue-next.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/admin/js/admin_common.js"></script>
    
    <!-- Additional Head from content -->
    <th:block th:replace="${head} ?: ~{}"></th:block>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <admin-header></admin-header>

        <div class="main-container" th:classappend="${noSidebar == true} ? 'no-sidebar' : ''">
            <!-- Sidebar -->
            <admin-sidebar th:if="${noSidebar != true}"></admin-sidebar>
            <!-- Spacer for no-sidebar main page if needed -->
            <div th:if="${noSidebar == true}" class="sidebar" style="background-color: transparent; border-right: none;"></div>

            <!-- Main Content -->
            <main class="content">
                <th:block th:replace="${content}">
                    <!-- Page content will be inserted here -->
                </th:block>
                
                <!-- Footer -->
                <admin-footer></admin-footer>
            </main>
        </div>
    </div>

    <!-- Vue Templates from Thymeleaf Fragments -->
    <div th:replace="~{admin/layout/header :: headerTemplate}"></div>
    <div th:replace="~{admin/layout/side :: sideTemplate}"></div>
    <div th:replace="~{admin/layout/footer :: footerTemplate}"></div>

    <!-- Script Block from content -->
    <th:block th:replace="${script} ?: ~{}"></th:block>
    
    <script>
        // Default Vue App logic if not provided by page
        if (typeof initVueApp === 'undefined') {
            const { createApp, onMounted } = Vue;
            const app = createApp({
                setup() {
                    onMounted(() => {
                        AdminMenu.init();
                    });
                    return {};
                }
            });
            const bvn = window['bootstrap-vue-next'];
            if (bvn) {
                app.use(bvn.BootstrapVueNext || bvn.default || bvn);
            }
            AdminLayout.register(app);
            app.mount('#app');
        }
    </script>
</body>
</html>
