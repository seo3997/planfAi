<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-board-content}, ~{::#admin-board-script}, ~{})}">
<head>
    <title>게시글 수정 - planF</title>
</head>
<body>
    <div id="admin-board-content">
        <div class="page-title-box">
            <h2 class="page-title">게시판 수정</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 게시판 > <span class="text-primary fw-medium">게시판</span>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">
                <i class="bi bi-caret-right-fill text-primary"></i> 게시글 정보 수정
            </div>
            <table class="form-table">
                <tr>
                    <th>게시판 구분</th>
                    <td>
                        <select class="form-select" v-model="board.BBS_SE_CODE_M" disabled style="width: 350px;">
                            <option v-for="item in categoryCodes" :key="item.CODE" :value="item.CODE">
                                {{ item.CODE_NM }}
                            </option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th class="required">제목</th>
                    <td>
                        <input type="text" class="form-control" v-model="board.SJ" placeholder="제목을 입력하세요">
                    </td>
                </tr>
                <tr>
                    <th class="required">내용</th>
                    <td>
                        <textarea class="form-control" v-model="board.CN" rows="12" placeholder="내용을 입력하세요"></textarea>
                    </td>
                </tr>
                <tr>
                    <th>첨부파일</th>
                    <td>
                        <div class="d-flex gap-2 align-items-center">
                            <input type="file" class="form-control" multiple @change="onFileChange" style="width: 500px;">
                            <span class="text-muted small">* 추가할 파일을 선택하세요.</span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th>첨부파일 표시여부</th>
                    <td>
                        <div class="d-flex align-items-center gap-3 py-1">
                            <div class="form-check m-0">
                                <input class="form-check-input" type="radio" v-model="board.ATCH_YN" value="Y" id="atchY">
                                <label class="form-check-label" for="atchY">다운로드</label>
                            </div>
                            <div class="form-check m-0">
                                <input class="form-check-input" type="radio" v-model="board.ATCH_YN" value="N" id="atchN">
                                <label class="form-check-label" for="atchN">화면표시</label>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th>기존 첨부파일</th>
                    <td>
                        <div v-if="board.fileList && board.fileList.length > 0">
                            <div v-for="file in board.fileList" :key="file.FILE_ID" class="existing-file">
                                <span class="small"><i class="bi bi-file-earmark-text text-primary me-2"></i> {{ file.ORIGNL_FILE_NM }} ({{ formatSize(file.FILE_SIZE) }})</span>
                                <button class="btn btn-sm btn-outline-danger" @click="removeFile(file.FILE_ID)"><i class="bi bi-x-lg"></i> 삭제</button>
                            </div>
                        </div>
                        <div v-else class="text-muted small py-2">첨부파일이 없습니다.</div>
                    </td>
                </tr>
            </table>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4 mb-5">
            <button class="btn btn-list" @click="goDetail"><i class="bi bi-reply"></i> 취소</button>
            <button class="btn btn-submit" @click="updateBoard">수정 완료</button>
        </div>
    </div>

    <div id="admin-board-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;

            const app = createApp({
                setup() {
                    const categoryCodes = ref([]);
                    const board = ref({ fileList: [] });
                    const selectedFiles = ref([]);
                    const params = new URLSearchParams(window.location.search);
                    const bbsSeq = params.get('bbs_seq');

                    const fetchCategories = async () => {
                        categoryCodes.value = await AdminCode.getCodes('R010170');
                    };

                    const fetchDetail = () => {
                        if(!bbsSeq) return;
                        axios.get(`/api/admin/mgt/board/${bbsSeq}`)
                            .then(res => board.value = res.data);
                    };

                    const onFileChange = (e) => {
                        selectedFiles.value = Array.from(e.target.files);
                    };

                    const formatSize = (bytes) => {
                        if (!bytes || bytes === 0) return '0 B';
                        const k = 1024;
                        const sizes = ['B', 'KB', 'MB', 'GB'];
                        const i = Math.floor(Math.log(bytes) / Math.log(k));
                        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                    };

                    const removeFile = (fileId) => {
                        if (confirm('해당 파일을 삭제하시겠습니까?')) {
                            axios.delete(`/api/admin/mgt/board/file/${fileId}`)
                                .then(() => {
                                    alert('파일이 삭제되었습니다.');
                                    fetchDetail();
                                }).catch(err => alert('파일 삭제 중 오류 발생'));
                        }
                    };

                    const updateBoard = () => {
                        if (!board.value.SJ) return alert('제목을 입력하세요.');
                        if (!board.value.CN) return alert('내용을 입력하세요.');

                        const formData = new FormData();
                        formData.append('sj', board.value.SJ);
                        formData.append('cn', board.value.CN);
                        formData.append('atch_yn', board.value.ATCH_YN);
                        formData.append('atch_doc_id', board.value.ATCH_DOC_ID || '');
                        
                        selectedFiles.value.forEach(file => {
                            formData.append('files', file);
                        });

                        axios.put(`/api/admin/mgt/board/${bbsSeq}`, formData, {
                            headers: { 'Content-Type': 'multipart/form-data' }
                        }).then(() => {
                            alert('수정되었습니다.');
                            goDetail();
                        }).catch(err => alert('수정 중 오류 발생'));
                    };

                    const goDetail = () => {
                        location.href = `/admin/mgt/mboard/selectBoard.do?bbs_seq=${bbsSeq}`;
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchCategories();
                        fetchDetail();
                    });

                    return { categoryCodes, board, selectedFiles, onFileChange, formatSize, removeFile, updateBoard, goDetail };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
