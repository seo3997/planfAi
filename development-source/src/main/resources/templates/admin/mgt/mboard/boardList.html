<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-board-content}, ~{::#admin-board-script}, ~{})}">
<head>
    <title>게시판 관리 - planF</title>
</head>
<body>
    <div id="admin-board-content">
        <div class="page-title-box">
            <h2 class="page-title">게시판</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 게시판 > <span class="text-primary fw-medium">게시판</span>
            </div>
        </div>

        <div class="mgmt-card">
            <!-- 검색 영역 (Refactored to Div-based) -->
            <div class="search-filter-box">
                <div class="filter-row">
                    <div class="filter-item">
                        <div class="filter-label">게시판 구분</div>
                        <div class="filter-content">
                            <select class="form-select form-select-sm" v-model="searchDto.sch_bbs_se_code">
                                <option value="">전체</option>
                                <option v-for="item in categoryCodes" :key="item.CODE" :value="item.CODE">
                                    {{ item.CODE_NM }}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-item">
                        <div class="filter-label">상세 검색</div>
                        <div class="filter-content">
                            <input type="text" class="form-control form-control-sm" v-model="searchDto.sch_text" placeholder="검색어를 입력하세요" @keyup.enter="fetchBoardList">
                        </div>
                    </div>
                </div>
                
                <div class="search-filter-actions">
                    <button class="btn btn-sm btn-reset d-flex align-items-center justify-content-center gap-1" @click="resetSearch">
                        <i class="bi bi-arrow-counterclockwise"></i> 초기화
                    </button>
                    <button class="btn btn-sm btn-search d-flex align-items-center justify-content-center gap-1" @click="fetchBoardList">
                        <i class="bi bi-search"></i> 검색
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="text-muted fs-7">
                    검색결과 <span class="text-primary fw-bold">{{ totalCount }}</span>개
                </div>
                <button class="btn btn-sm btn-primary" @click="goForm"><i class="bi bi-pencil"></i> 등록</button>
            </div>

            <div class="data-table-wrapper">
                <b-table
                    class="admin-b-table"
                    :items="boardList"
                    :fields="fields"
                    hover
                    @row-clicked="(item) => goDetail(item.BBS_SEQ)"
                    show-empty
                    empty-text="등록된 게시글이 없습니다."
                >
                    <!-- No (Index) -->
                    <template #cell(no)="data">
                        {{ totalCount - ((currentPage - 1) * pageSize) - data.index }}
                    </template>

                    <!-- 자료제목 -->
                    <template #cell(SJ)="data">
                        <span class="text-dark">{{ data.value }}</span>
                    </template>

                    <!-- 작성일 -->
                    <template #cell(REGIST_DT)="data">
                        {{ formatDate(data.value) }}
                    </template>
                </b-table>
            </div>

            <!-- 페이징 -->
            <admin-pagination 
                :total-count="totalCount" 
                :current-page="currentPage" 
                :page-size="pageSize"
                @change-page="handlePageChange">
            </admin-pagination>
        </div>
    </div>

    <div id="admin-board-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted, computed } = Vue;

            const app = createApp({
                setup() {
                    const boardList = ref([]);
                    const totalCount = ref(0);
                    const currentPage = ref(1);
                    const pageSize = 10;
                    const categoryCodes = ref([]);

                    const searchDto = ref({
                        sch_bbs_se_code: '',
                        sch_text: ''
                    });

                    const fetchCategories = async () => {
                        categoryCodes.value = await AdminCode.getCodes('R010170');
                    };

                    const fetchBoardList = () => {
                        axios.get('/api/admin/mgt/board/list', {
                            params: { ...searchDto.value, page: currentPage.value, size: pageSize }
                        }).then(res => {
                            boardList.value = res.data.list;
                            totalCount.value = res.data.totalCount;
                        }).catch(err => {
                            console.error('Error fetching board list:', err);
                        });
                    };

                    const resetSearch = () => {
                        searchDto.value = {
                            sch_bbs_se_code: '',
                            sch_text: ''
                        };
                        currentPage.value = 1;
                        fetchBoardList();
                    };

                    const formatDate = (dt) => {
                        if (!dt) return '';
                        return dt.split(' ')[0].replace(/-/g, '.');
                    };

                    const handlePageChange = (p) => {
                        currentPage.value = p;
                        fetchBoardList();
                    };

                    const goDetail = (seq) => {
                        location.href = `/admin/mgt/mboard/selectBoard.do?bbs_seq=${seq}`;
                    };

                    const goForm = () => {
                        location.href = '/admin/mgt/mboard/insertFormBoard.do';
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchCategories();
                        fetchBoardList();
                    });

                    const fields = [
                        { key: 'no', label: 'No', thStyle: { width: '80px' } },
                        { key: 'SJ', label: '자료제목', tdClass: 'text-start px-3' },
                        { key: 'REGISTER_NM', label: '작성자', thStyle: { width: '150px' } },
                        { key: 'REGIST_DT', label: '작성일', thStyle: { width: '150px' } }
                    ];

                    return {
                        boardList, totalCount, currentPage, pageSize, fields,
                        searchDto, categoryCodes,
                        fetchBoardList, resetSearch, handlePageChange, goDetail, goForm, formatDate
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
