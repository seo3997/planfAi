<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문 미리보기</title>
    
    <!-- CSS -->
    <link href="/common/lib/css/bootstrap.min.css" rel="stylesheet">
    <link href="/common/lib/css/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="/common/lib/js/vue.global.js"></script>
    <script src="/common/lib/js/axios.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map-container { height: 400px; width: 100%; border-radius: 8px; }
        .map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
        .map-modal.show { display: flex; }
        .map-modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 800px; }
        
        body {
            background-color: #f8f9fa;
            transition: background-color 0.3s ease;
            margin: 0;
            padding: 0;
        }
        .survey-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            width: 100%;
        }
        .survey-container {
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex-grow: 1;
            transition: all 0.3s ease;
        }
        
        /* Semi-Transparent Professional Layout */
        body.has-bg .survey-container {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border-radius: 24px;
        }
        
        body.has-bg .question-box.card {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin-bottom: 40px !important;
        }

        body.has-bg .survey-header {
            background-color: transparent !important;
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 40px;
            margin-bottom: 40px;
        }

        body.has-bg .form-control, body.has-bg .form-select {
            background-color: #ffffff !important;
            border: 1px solid #ced4da !important;
            color: #212529 !important;
            border-radius: 8px;
        }

        body.has-bg .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.1);
        }

        .survey-header {
            margin-bottom: 40px;
        }
        .logo-area { margin-bottom: 30px; display: flex; }
        .logo-area.align-LEFT { justify-content: flex-start; }
        .logo-area.align-CENTER { justify-content: center; }
        .logo-area.align-RIGHT { justify-content: flex-end; }
        .logo-img { max-height: 60px; }

        .question-box {
            margin-bottom: 40px;
        }
        /* Global Theme Consistency */
        input, select, textarea, button, label {
            font-family: inherit;
        }

        .question-title {
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 1.25rem;
            color: inherit;
        }
        .question-desc, .text-muted {
            font-size: 0.95rem;
            opacity: 0.7; /* Instead of fixed grey, use opacity for better consistency */
            margin-bottom: 15px;
            color: inherit !important;
        }
        
        /* Clean Option Style */
        .form-check {
            padding: 10px 12px 10px 2.5em;
            border-radius: 8px;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: background-color 0.2s ease;
        }
        .form-check:hover {
            background-color: rgba(0,0,0,0.03);
        }
        .form-check-input {
            cursor: pointer;
            margin-top: 0.3em;
        }
        .form-check-label {
            cursor: pointer;
            width: 100%;
            display: inline-block;
            color: inherit !important;
            font-weight: 500;
        }
        
        /* Layout Definitions */
        .layout-center { 
            max-width: 800px; 
            margin-top: 50px !important;
            margin-bottom: 50px !important;
            flex-grow: 0 !important;
        }
        .layout-top_banner { 
            max-width: 1000px; 
            margin-top: 50px !important;
            margin-bottom: 50px !important;
            flex-grow: 0 !important;
        }
        
        .layout-left_1_3, .layout-right_1_2 { 
            max-width: 1200px; 
            display: flex; 
            gap: 40px; 
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            margin-top: 50px !important;
            margin-bottom: 50px !important;
            flex-grow: 0 !important;
            padding: 0 !important;
        }
        
        .layout-right_1_2 {
            flex-direction: row-reverse;
        }

        .layout-sidebar { 
            width: 320px; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            height: fit-content;
            border: 1px solid #e9ecef;
        }

        .layout-main { 
            flex-grow: 1; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }

        .btn-primary {
            padding: 14px 40px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 1100px) {
            .layout-left_1_3, .layout-right_1_2 { 
                flex-direction: column; 
                padding: 0 20px !important;
            }
            .layout-sidebar, .layout-main { width: 100%; }
        }

        @media (max-width: 768px) {
            .survey-container { 
                margin-top: 0 !important; 
                margin-bottom: 0 !important; 
                border-radius: 0 !important; 
            }
            .layout-center, .layout-top_banner { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div id="app" class="survey-wrapper" :style="rootStyle">
        
        <div class="survey-container" :class="'layout-' + (survey.layoutType || 'center').toLowerCase()" :style="containerStyle">
            
            <div :class="isSidebarLayout ? 'layout-sidebar' : ''" :style="isSidebarLayout ? containerStyle : {}">
                <!-- Logo -->
                <div v-if="survey.logoImagePath" class="logo-area" :class="'align-' + survey.logoAlign">
                    <img :src="survey.logoImagePath" class="logo-img" alt="Logo">
                </div>

                <!-- Custom Header -->
                <div v-if="survey.header" v-html="survey.header" class="mb-4"></div>

                <div class="survey-header" v-if="survey.surveyTitle" :class="{'text-center': !isSidebarLayout}">
                    <h1 class="mb-3 fw-bold">{{ survey.surveyTitle }}</h1>
                    <p v-if="survey.numberRoductionText" class="text-muted fs-5">{{ survey.numberRoductionText }}</p>
                </div>
            </div>

            <div :class="isSidebarLayout ? 'layout-main' : ''" :style="isSidebarLayout ? containerStyle : {}">
                <form @submit.prevent="submitSurvey">
           <div v-for="(section, sIdx) in survey.sections" :key="sIdx" class="mb-5">
                <h3 v-if="section.sectionTitle" class="mb-4 pb-2 border-bottom">{{ section.sectionTitle }}</h3>
                <div v-if="section.sectionHtmlTitle" v-html="section.sectionHtmlTitle" class="mb-3"></div>

                <div v-for="(question, qIdx) in section.questions" :key="qIdx" class="question-box card border-0 shadow-none">
                    <div class="card-body" :class="!isSidebarLayout ? 'p-0' : ''">
                        <!-- Question Text -->
                        <div class="question-title">
                            <span v-if="survey.sections.length > 1">{{ sIdx + 1 }}-{{ qIdx + 1 }}. </span>
                            <span v-else>{{ qIdx + 1 }}. </span>
                            {{ question.questionText }}
                            <span v-if="question.required" class="text-danger">*</span>
                        </div>
                        
                        <!-- Question Input -->
                        <div class="mt-2">
                             <!-- Radio -->
                             <div v-if="question.questionType === 'inputRadio'" 
                                  :class="question.questionLayout === 'horizontal' ? 'd-flex flex-wrap gap-3' : ''">
                                <div v-for="(label, lIdx) in question.labels" :key="lIdx" class="form-check mb-2">
                                    <input class="form-check-input" type="radio" 
                                           :name="'q_' + question.questionId" 
                                           :id="'q_' + question.questionId + '_' + label.questionLabelId"
                                           :value="label.questionLabelId"
                                           v-model="answers[question.questionId]">
                                    <label class="form-check-label" :for="'q_' + question.questionId + '_' + label.questionLabelId">
                                        {{ label.questionLabel }}
                                    </label>
                                </div>
                                <!-- Other (Radio) -->
                                <div v-if="question.otherAnswer === 'Y'" class="form-check d-flex align-items-center gap-2 mb-2">
                                    <input class="form-check-input" type="radio" 
                                           :name="'q_' + question.questionId" 
                                           :id="'q_' + question.questionId + '_other'"
                                           value="OTHER"
                                           v-model="answers[question.questionId]">
                                    <label class="form-check-label text-nowrap w-auto" :for="'q_' + question.questionId + '_other'">
                                        {{ question.questionLabel || '기타:' }}
                                    </label>
                                    <input type="text" class="form-control form-control-sm" style="min-width: 250px; flex: 1;" 
                                           v-model="answers[question.questionId + '_other_text']" 
                                           placeholder="내용을 입력하세요"
                                           :disabled="answers[question.questionId] !== 'OTHER'">
                                </div>
                             </div>

                             <!-- Checkbox -->
                             <div v-if="question.questionType === 'inputCheckbox'"
                                  :class="question.questionLayout === 'horizontal' ? 'd-flex flex-wrap gap-3' : ''">
                                <div v-for="(label, lIdx) in question.labels" :key="lIdx" class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" 
                                           :id="'q_' + question.questionId + '_' + label.questionLabelId"
                                           :value="label.questionLabelId"
                                           v-model="answers[question.questionId]">
                                    <label class="form-check-label" :for="'q_' + question.questionId + '_' + label.questionLabelId">
                                        {{ label.questionLabel }}
                                    </label>
                                </div>
                                <!-- Other (Checkbox) -->
                                <div v-if="question.otherAnswer === 'Y'" class="form-check d-flex align-items-center gap-2 mb-2">
                                    <input class="form-check-input" type="checkbox" 
                                           :id="'q_' + question.questionId + '_other'"
                                           value="OTHER"
                                           v-model="answers[question.questionId]">
                                    <label class="form-check-label text-nowrap w-auto" :for="'q_' + question.questionId + '_other'">
                                        {{ question.questionLabel || '기타:' }}
                                    </label>
                                    <input type="text" class="form-control form-control-sm" style="min-width: 250px; flex: 1;" 
                                           v-model="answers[question.questionId + '_other_text']" 
                                           placeholder="내용을 입력하세요"
                                           :disabled="!answers[question.questionId].includes('OTHER')">
                                </div>
                             </div>

                             <!-- Text Line -->
                             <div v-if="question.questionType === 'inputTextline'">
                                <input type="text" class="form-control" v-model="answers[question.questionId]" :maxlength="question.maxLength">
                             </div>

                             <!-- Text Area -->
                             <div v-if="question.questionType === 'inputTextarea'">
                                <textarea class="form-control" :rows="question.textRows || 4" v-model="answers[question.questionId]" :maxlength="question.maxLength"></textarea>
                             </div>

                              <!-- Location -->
                              <div v-if="question.questionType === 'inputLocation'">
                                  <div class="row g-2 mb-2">
                                      <div class="col-6">
                                          <div class="input-group input-group-sm">
                                              <span class="input-group-text bg-light">위도</span>
                                              <input type="text" class="form-control" v-model="answers[question.questionId].lat" placeholder="37.5665" readonly>
                                          </div>
                                      </div>
                                      <div class="col-6">
                                          <div class="input-group input-group-sm">
                                              <span class="input-group-text bg-light">경도</span>
                                              <input type="text" class="form-control" v-model="answers[question.questionId].lng" placeholder="126.9780" readonly>
                                          </div>
                                      </div>
                                  </div>
                                  <button type="button" class="btn btn-outline-primary btn-sm w-100" @click="openMap(question.questionId)">
                                      <i class="bi bi-geo-alt-fill me-1"></i> 지도에서 위치 선택하기
                                  </button>
                              </div>

                              <!-- Image Upload -->
                              <div v-if="question.questionType === 'inputImage'">
                                  <div class="d-grid">
                                      <label class="btn btn-outline-secondary py-3 border-dashed" style="cursor: pointer; border-style: dashed !important; border-width: 2px;">
                                          <input type="file" class="d-none" accept="image/png, image/jpeg, image/gif" @change="handleFileUpload($event, question.questionId)">
                                          <div class="d-flex flex-column align-items-center">
                                              <i class="bi bi-image fs-3 mb-1"></i>
                                              <span class="fw-bold">이미지 선택하기</span>
                                              <span class="small text-muted">PNG, JPG, GIF 파일만 가능</span>
                                          </div>
                                      </label>
                                  </div>
                                  <div v-if="answers[question.questionId] && answers[question.questionId].name" class="mt-3 text-center p-3 border rounded bg-light anim-fade-in">
                                      <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                                          <span class="small text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i> 선택된 파일: {{ answers[question.questionId].name }}</span>
                                          <button type="button" class="btn-close small" style="transform: scale(0.7);" @click="answers[question.questionId] = null"></button>
                                      </div>
                                      <img :id="'preview_' + question.questionId" class="img-fluid rounded shadow-sm border" style="max-height: 200px;" alt="Preview">
                                  </div>
                              </div>

                             <!-- Comment -->
                             <div v-if="question.questionType === 'inputComment'" class="text-muted bg-light p-3 rounded">
                                <span v-html="question.questionText"></span>
                             </div>
                        </div>
                    </div>
                </div>
           </div>

                   <div class="d-grid gap-2 col-6 mx-auto mt-5 mb-5">
                        <button type="submit" class="btn btn-primary btn-lg" :style="accentButtonStyle">제출 확인 (미리보기)</button>
                   </div>
                </form>

                <!-- Custom Footer -->
                <div v-if="survey.footer" v-html="survey.footer" class="mt-5 border-top pt-3"></div>
                
                <!-- Service Logo in Footer -->
                <div v-if="survey.showFooterLogo === 'Y'" class="text-center mt-4">
                    <img src="/admin/images/logo_icon.png" alt="PlanfAi" style="height: 24px; opacity: 0.5;">
                    <p class="small text-muted mt-1">Powered by PlanfAi</p>
                </div>
            </div>
        </div>
        
        <!-- User CSS Injection -->
        <div v-if="survey.userCss" style="display:none">
            <teleport to="head">
                <component is="style">{{ survey.userCss }}</component>
            </teleport>
        </div>

        <!-- Map Modal -->
        <div class="map-modal" :class="{'show': mapModal.show}" @click.self="closeMap">
            <div class="map-modal-content anim-fade-in">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="m-0 fw-bold"><i class="bi bi-map me-2"></i>지도에서 위치 선택</h5>
                    <button type="button" class="btn-close" @click="closeMap"></button>
                </div>
                
                <!-- Search Box -->
                <div class="input-group mb-3">
                    <input type="text" class="form-control" v-model="mapSearchKeyword" placeholder="주소를 입력하세요 (예: 강남역, 시청 등)" @keyup.enter="searchAddress">
                    <button class="btn btn-outline-primary" type="button" @click="searchAddress">
                        <i class="bi bi-search"></i> 검색
                    </button>
                </div>

                <div id="map-container"></div>
                <div class="mt-3 text-end">
                    <button type="button" class="btn btn-secondary me-2" @click="closeMap">취소</button>
                    <button type="button" class="btn btn-primary" @click="confirmLocation">위치 확정</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const serverSurveyForm = /*[[${surveyForm}]]*/ {};
        /*]]>*/

        const { createApp, ref, onMounted } = Vue;
        const app = createApp({
            setup() {
                const survey = ref(serverSurveyForm || {});
                const answers = ref({});
                const rootStyle = ref({});
                const containerStyle = ref({});
                const accentButtonStyle = ref({});

                const isSidebarLayout = Vue.computed(() => {
                    return ['LEFT_1_3', 'RIGHT_1_2'].includes(survey.value.layoutType);
                });

                // Initialize styles
                if (survey.value.fontFamily) {
                    const fonts = survey.value.fontFamily.split(',').map(f => {
                        let trimmed = f.trim();
                        if (trimmed.includes(' ') && !trimmed.includes("'") && !trimmed.includes('"')) {
                            return `'${trimmed}'`;
                        }
                        return trimmed;
                    });
                    const ff = fonts.join(', ');
                    rootStyle.value.fontFamily = ff;
                    document.body.style.fontFamily = ff;
                }
                if (survey.value.bgImagePath) {
                    document.body.style.backgroundImage = `url('${survey.value.bgImagePath}')`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundAttachment = 'fixed';
                    document.body.style.backgroundPosition = 'center';
                    document.body.classList.add('has-bg');
                    
                    // If background color exists, apply it with alpha to the container
                    if (survey.value.bgColor) {
                        const hex = survey.value.bgColor;
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        containerStyle.value.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.6)`;
                    }
                } else if (survey.value.bgColor) {
                    document.body.style.backgroundColor = '#f8f9fa'; // Keep body light
                    containerStyle.value.backgroundColor = survey.value.bgColor;
                }
                
                if (survey.value.textColor) {
                    rootStyle.value.color = survey.value.textColor;
                    containerStyle.value.color = survey.value.textColor;
                }
                if (survey.value.fontSize) {
                    containerStyle.value.fontSize = survey.value.fontSize;
                }
                if (survey.value.accentColor) {
                    accentButtonStyle.value.backgroundColor = survey.value.accentColor;
                    accentButtonStyle.value.borderColor = survey.value.accentColor;
                }
                
                if (survey.value.showBorder === 'N') {
                    containerStyle.value.boxShadow = 'none';
                    containerStyle.value.border = 'none';
                }
                
                // Initialize answers
                if (survey.value.sections) {
                    survey.value.sections.forEach(s => {
                        if (s.questions) {
                            s.questions.forEach(q => {
                                if (q.questionType === 'inputCheckbox') {
                                    answers.value[q.questionId] = [];
                                } else if (q.questionType === 'inputLocation') {
                                    answers.value[q.questionId] = { lat: '', lng: '' };
                                } else if (q.questionType === 'inputImage') {
                                    answers.value[q.questionId] = null; // File object
                                } else {
                                    answers.value[q.questionId] = '';
                                }
                            });
                        }
                    });
                }

                const mapModal = ref({ show: false, questionId: null, lat: null, lng: null });
                const mapSearchKeyword = ref('');
                let leafletMap = null;
                let mapMarker = null;

                const searchAddress = async () => {
                    if (!mapSearchKeyword.value) return;
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(mapSearchKeyword.value)}`);
                        const data = await response.json();
                        if (data && data.length > 0) {
                            const result = data[0];
                            const newLat = parseFloat(result.lat);
                            const newLng = parseFloat(result.lon);
                            
                            mapModal.value.lat = newLat.toFixed(6);
                            mapModal.value.lng = newLng.toFixed(6);
                            
                            if (leafletMap) {
                                leafletMap.setView([newLat, newLng], 15);
                                if (mapMarker) mapMarker.setLatLng([newLat, newLng]);
                            }
                        } else {
                            alert('검색 결과가 없습니다.');
                        }
                    } catch (error) {
                        console.error('Search error:', error);
                        alert('검색 중 오류가 발생했습니다.');
                    }
                };

                const openMap = (questionId) => {
                    mapModal.value.questionId = questionId;
                    mapModal.value.lat = answers.value[questionId].lat || 37.5665;
                    mapModal.value.lng = answers.value[questionId].lng || 126.9780;
                    mapModal.value.show = true;
                    
                    setTimeout(() => {
                        if (!leafletMap) {
                            leafletMap = L.map('map-container').setView([mapModal.value.lat, mapModal.value.lng], 13);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                attribution: '&copy; OpenStreetMap contributors'
                            }).addTo(leafletMap);
                            
                            mapMarker = L.marker([mapModal.value.lat, mapModal.value.lng], { draggable: true }).addTo(leafletMap);
                            
                            leafletMap.on('click', (e) => {
                                mapMarker.setLatLng(e.latlng);
                                mapModal.value.lat = e.latlng.lat.toFixed(6);
                                mapModal.value.lng = e.latlng.lng.toFixed(6);
                            });
                            
                            mapMarker.on('dragend', (e) => {
                                const pos = e.target.getLatLng();
                                mapModal.value.lat = pos.lat.toFixed(6);
                                mapModal.value.lng = pos.lng.toFixed(6);
                            });
                        } else {
                            leafletMap.setView([mapModal.value.lat, mapModal.value.lng], 13);
                            mapMarker.setLatLng([mapModal.value.lat, mapModal.value.lng]);
                        }
                        leafletMap.invalidateSize();
                    }, 100);
                };

                const closeMap = () => {
                    mapModal.value.show = false;
                };

                const confirmLocation = () => {
                    const qId = mapModal.value.questionId;
                    answers.value[qId].lat = mapModal.value.lat;
                    answers.value[qId].lng = mapModal.value.lng;
                    closeMap();
                };

                const handleFileUpload = (event, questionId) => {
                    const file = event.target.files[0];
                    if (file) {
                        answers.value[questionId] = file;
                        // Preview logic
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = document.getElementById('preview_' + questionId);
                            if (img) img.src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                };

                const submitSurvey = () => {
                    alert('미리보기 모드입니다.\n작성한 답변 데이터:\n' + JSON.stringify(answers.value, null, 2));
                };

                return {
                    survey, answers, rootStyle, containerStyle, accentButtonStyle, isSidebarLayout,
                    submitSurvey, handleFileUpload,
                    mapModal, mapSearchKeyword, openMap, closeMap, confirmLocation, searchAddress
                };
            }
        });
        app.mount('#app');
    </script>
</body>
</html>
