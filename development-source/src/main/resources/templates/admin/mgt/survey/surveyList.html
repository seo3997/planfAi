<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-survey-content}, ~{::#admin-survey-script}, ~{})}">
<head>
    <title>설문 관리 - PlanfAi 관리자</title>
</head>
<body>
    <div id="admin-survey-content">
        <div class="page-title-box">
            <h2 class="page-title">설문 리스트</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 운영 업무 > <span class="text-primary fw-medium">설문 관리</span>
            </div>
        </div>

        <div class="mgmt-card">
            <!-- Search Area -->
            <div class="search-filter-box">
                <div class="filter-row">
                    <!-- SEARCH_KEYWORD -->
                    <div class="filter-item">
                        <div class="filter-label">검색어</div>
                        <div class="filter-content">
                             <select class="form-select form-select-sm" style="width: 120px; flex: none;" v-model="searchDto.searchCondition">
                                <option value="ALL">전체</option>
                                <option value="TITLE">제목</option>
                                <option value="ID">아이디</option>
                            </select>
                            <input type="text" class="form-control form-control-sm" v-model="searchDto.searchKeyword" @keyup.enter="doSearch" placeholder="검색어를 입력하세요">
                        </div>
                    </div>
                </div>

                <div class="search-filter-actions">
                    <button class="btn btn-sm btn-reset d-flex align-items-center justify-content-center gap-1" @click="resetSearch">
                        <i class="bi bi-arrow-counterclockwise"></i>초기화
                    </button>
                    <button class="btn btn-sm btn-search d-flex align-items-center justify-content-center gap-1" @click="doSearch">
                        <i class="bi bi-search"></i>검색
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="text-muted fs-7">
                    총 <span class="text-primary fw-bold">{{ totalCount }}</span>검
                </div>
                <button class="btn btn-sm btn-primary" @click="goRegister">
                    <i class="bi bi-pencil me-1"></i>설문 등록
                </button>
            </div>

            <div class="data-table-wrapper">
                <b-table
                    class="admin-b-table"
                    :items="surveyList"
                    :fields="fields"
                    hover
                    @row-clicked="goDetail"
                    show-empty
                    empty-text="조회된 설문이 없습니다."
                >
                    <!-- No (Index) -->
                    <template #cell(no)="data">
                        {{ totalCount - ((currentPage - 1) * pageSize) - data.index }}
                    </template>

                    <!-- Survey Title (Link style) -->
                    <template #cell(surveyTitle)="data">
                        <span class="text-primary fw-bold cursor-pointer">{{ data.value }}</span>
                    </template>

                    <!-- Status (Badge) -->
                    <template #cell(opened)="data">
                        <span class="badge" 
                              :class="data.value === 'OPENED' ? 'bg-success' : 'bg-secondary'">
                            {{ data.value === 'OPENED' ? '진행중' : '마감' }}
                        </span>
                    </template>
                    
                    <!-- Reg Date -->
                    <template #cell(registDt)="data">
                        {{ formatDate(data.value) }}
                    </template>
                </b-table>
            </div>

            <!-- Pagination -->
            <div class="mt-4 d-flex justify-content-center">
                <b-pagination
                    v-model="currentPage"
                    :total-rows="totalCount"
                    :per-page="pageSize"
                    size="sm"
                    @update:model-value="handlePageChange"
                ></b-pagination>
            </div>

            <!-- Create Survey Modal -->
            <b-modal id="modal-create-survey" v-model="showCreateModal" title="설문 생성" @ok="createSurvey" ok-title="생성" cancel-title="취소">
                <form @submit.prevent="createSurvey">
                    <div class="mb-3">
                        <label class="form-label">설문 ID (자동생성)</label>
                        <input type="text" class="form-control" v-model="newSurvey.surveyId" placeholder="입력하지 않으면 자동 생성됩니다">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">설문 제목 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" v-model="newSurvey.surveyTitle" required placeholder="설문 제목을 입력하세요">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">담당자 이메일</label>
                        <input type="email" class="form-control" v-model="newSurvey.adminEmail" placeholder="담당자 이메일">
                    </div>
                </form>
            </b-modal>
        </div>
    </div>

    <div id="admin-survey-script">
        <script th:inline="javascript">
            /*<![CDATA[*/
            const serverResultList = /*[[${resultList}]]*/ [];
            const serverTotalCount = /*[[${totalCount}]]*/ 0;
            const serverSearchVO = /*[[${searchVO}]]*/ {};
            /*]]>*/

            const initVueApp = true; // IMPORTANT
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const surveyList = ref(serverResultList || []);
                    const totalCount = ref(serverTotalCount || 0);
                    
                    // From Model
                    const currentPage = ref(serverSearchVO.pageIndex || 1);
                    const pageSize = serverSearchVO.recordCountPerPage || 10;
                    
                    const searchDto = ref({
                        searchCondition: serverSearchVO.searchCondition || 'ALL',
                        searchKeyword: serverSearchVO.searchKeyword || ''
                    });

                    // New Survey Data
                    const newSurvey = ref({
                        surveyId: '',
                        surveyTitle: '',
                        adminEmail: '',
                        opened: 'OPENED'
                    });

                    // Search Action (SSR Reload)
                    const doSearch = () => {
                        const params = new URLSearchParams();
                        params.append('pageIndex', 1); // Reset to page 1 on search
                        params.append('searchCondition', searchDto.value.searchCondition);
                        params.append('searchKeyword', searchDto.value.searchKeyword);
                        window.location.href = '/mgt/survey/selectPageListSurvey.do?' + params.toString();
                    };

                    const resetSearch = () => {
                        window.location.href = '/mgt/survey/selectPageListSurvey.do';
                    };

                    const handlePageChange = (page) => {
                        const params = new URLSearchParams();
                        params.append('pageIndex', page);
                        params.append('searchCondition', searchDto.value.searchCondition);
                        params.append('searchKeyword', searchDto.value.searchKeyword);
                        window.location.href = '/mgt/survey/selectPageListSurvey.do?' + params.toString();
                    };

                    const goRegister = () => {
                        // Open Modal
                        newSurvey.value = { surveyId: '', surveyTitle: '', adminEmail: '', opened: 'OPENED' };
                        const modal = window['bootstrap-vue-next'].useModalController ? window['bootstrap-vue-next'].useModalController() : null;
                        // BootstrapVueNext uses v-model for visibility usually, but here we use ID
                        // We can use standard Bootstrap JS or BVN method.
                        // Ideally we bind v-model="showModal"
                        // But let's check BVN documentation usage in this project.
                        // Assuming simple ID based usage is not fully supported in Vue3 BVN without directive.
                        // Let's use a ref for modal visibility
                    };
                    
                    // Let's use a reactive variable for modal visibility if b-modal supports v-model
                    // Since I cannot see b-modal props easily, relying on ID might be risky with Vue 3.
                    // Let's use a ref `showCreateModal`.
                    const showCreateModal = ref(false);

                    const openCreateModal = () => {
                        newSurvey.value = { surveyId: '', surveyTitle: '', adminEmail: '', opened: 'OPENED' };
                        showCreateModal.value = true;
                    };

                    const createSurvey = async (bvModalEvent) => {
                        if (!newSurvey.value.surveyTitle) {
                            alert('설문 제목을 입력해주세요.');
                            if(bvModalEvent) bvModalEvent.preventDefault();
                            return;
                        }

                        try {
                            const response = await axios.post('/mgt/survey/saveEntryForm.do', newSurvey.value);
                            const res = response.data;
                            
                            if (res.status === 'success') {
                                alert(res.message);
                                showCreateModal.value = false;
                                // Reload page to show new survey
                                window.location.reload(); 
                            } else {
                                alert(res.message);
                                if(bvModalEvent) bvModalEvent.preventDefault();
                            }
                        } catch (error) {
                            console.error('Create error:', error);
                            alert('생성 중 오류가 발생했습니다.');
                            if(bvModalEvent) bvModalEvent.preventDefault();
                        }
                    };

                    const goDetail = (item) => {
                        // Go to Master Management
                        window.location.href = `/mgt/survey/manageSurveyMenu.do?surveyId=${item.surveyId}`;
                    };

                    const formatDate = (val) => {
                        if (!val) return '';
                        return new Date(val).toLocaleDateString();
                    };

                    const fields = [
                        { key: 'no', label: 'No', thStyle: { width: '60px' }, tdClass: 'text-center' },
                        { key: 'surveyId', label: '설문ID', thStyle: { width: '120px' }, tdClass: 'text-center' },
                        { key: 'surveyTitle', label: '설문 제목', tdClass: 'text-start ps-3' },
                        { key: 'opened', label: '상태', thStyle: { width: '100px' }, tdClass: 'text-center' },
                        { key: 'adminEmail', label: '담당자', thStyle: { width: '150px' }, tdClass: 'text-center' },
                        { key: 'registDt', label: '등록일', thStyle: { width: '120px' }, tdClass: 'text-center' }
                    ];

                    onMounted(() => {
                        AdminMenu.init(); // Initialize Layout Menu
                    });

                    return {
                        surveyList, totalCount, currentPage, pageSize, fields,
                        searchDto, doSearch, resetSearch, handlePageChange,
                        goRegister: openCreateModal, goDetail, formatDate,
                        newSurvey, createSurvey, showCreateModal, openCreateModal
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#app'); // Mount to layout content
        </script>
    </div>
</body>
</html>
