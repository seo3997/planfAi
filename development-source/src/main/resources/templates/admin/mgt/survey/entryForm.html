<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-survey-form}, ~{::#admin-survey-script}, ~{})}">
<head>
    <title>설문 양식 등록 - PlanfAi 관리자</title>
</head>
<body>
    <div id="admin-survey-form">
        <div class="page-title-box">
            <h2 class="page-title">설문 양식 등록</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 운영 업무 > 설문 관리 > <span class="text-primary fw-medium">양식 등록</span>
            </div>
        </div>

        <div class="mgmt-card">
            <!-- Form Start -->
            <form @submit.prevent="saveSurvey">
                
                <!-- 1. 기본 정보 -->
                <h5 class="mb-3 border-bottom pb-2">기본 정보</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">설문 제목 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" v-model="survey.surveyTitle" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">상태</label>
                        <select class="form-select" v-model="survey.opened">
                            <option value="OPENED">진행중 (OPENED)</option>
                            <option value="CLOSED">마감 (CLOSED)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">마감일</label>
                        <input type="date" class="form-control" v-model="survey.closed">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label">담당자 이메일</label>
                        <input type="email" class="form-control" v-model="survey.adminEmail">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">배경색</label>
                        <input type="color" class="form-control form-control-color w-100" v-model="survey.bgColor" title="배경색 선택">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">글자색</label>
                        <input type="color" class="form-control form-control-color w-100" v-model="survey.textColor" title="글자색 선택">
                    </div>
                </div>

                <!-- 2. 섹션 및 문항 관리 -->
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                    <h5 class="mb-0">문항 구성</h5>
                    <button type="button" class="btn btn-sm btn-outline-primary" @click="addSection">
                        <i class="bi bi-plus-lg"></i> 섹션 추가
                    </button>
                </div>

                <!-- Sections Loop -->
                <div v-for="(section, sIdx) in survey.sections" :key="sIdx" class="card mb-4 border-primary">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2 w-75">
                            <span class="badge bg-primary">Section {{ sIdx + 1 }}</span>
                            <input type="text" class="form-control form-control-sm" v-model="section.sectionTitle" placeholder="섹션 제목을 입력하세요">
                        </div>
                        <div>
                            <button type="button" class="btn btn-sm btn-danger" @click="removeSection(sIdx)">
                                <i class="bi bi-trash"></i> 삭제
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Questions Loop -->
                        <div v-for="(question, qIdx) in section.questions" :key="qIdx" class="card mb-3 border-secondary">
                            <div class="card-body p-3">
                                <div class="row mb-2">
                                    <div class="col-md-2">
                                        <select class="form-select form-select-sm" v-model="question.questionType">
                                            <option value="inputRadio">단일 선택 (Radio)</option>
                                            <option value="inputCheckbox">다중 선택 (Checkbox)</option>
                                            <option value="inputTextline">단답형 (Text)</option>
                                            <option value="inputTextarea">서술형 (Textarea)</option>
                                            <option value="inputComment">안내 문구 (Comment)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-8">
                                        <input type="text" class="form-control form-control-sm" v-model="question.questionText" placeholder="질문 내용을 입력하세요">
                                    </div>
                                    <div class="col-md-2 text-end">
                                        <button type="button" class="btn btn-xs btn-outline-danger" @click="removeQuestion(section, qIdx)">
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Options (Labels) Area: Only for Radio/Checkbox -->
                                <div v-if="['inputRadio', 'inputCheckbox'].includes(question.questionType)" class="ps-4 mt-2 border-start border-3">
                                    <div v-for="(label, lIdx) in question.labels" :key="lIdx" class="d-flex align-items-center gap-2 mb-1">
                                        <i class="bi" :class="question.questionType === 'inputRadio' ? 'bi-circle' : 'bi-square'"></i>
                                        <input type="text" class="form-control form-control-sm w-50" v-model="label.questionLabel" placeholder="보기 내용">
                                        <button type="button" class="btn btn-xs btn-light text-danger" @click="removeLabel(question, lIdx)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                    <button type="button" class="btn btn-xs btn-link text-decoration-none" @click="addLabel(question)">
                                        <i class="bi bi-plus"></i> 보기 추가
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-3">
                            <button type="button" class="btn btn-sm btn-outline-secondary dashed-border w-100" @click="addQuestion(section)">
                                <i class="bi bi-plus-circle"></i> 질문 추가
                            </button>
                        </div>
                    </div>
                </div>

                <div v-if="(!survey.sections || survey.sections.length === 0)" class="text-center p-5 text-muted bg-light rounded">
                    생성된 섹션이 없습니다. '섹션 추가' 버튼을 눌러 설문을 구성하세요.
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <button type="button" class="btn btn-light" @click="goList">취소</button>
                    <button type="submit" class="btn btn-primary" :disabled="isSaving">
                        <span v-if="isSaving" class="spinner-border spinner-border-sm me-1"></span>
                        저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-survey-script">
        <script th:inline="javascript">
            /*<![CDATA[*/
            const serverSurveyForm = /*[[${surveyForm}]]*/ {};
            /*]]>*/

            const initVueApp = true; // IMPORTANT
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const survey = ref(serverSurveyForm || {
                        surveyTitle: '',
                        opened: 'OPENED',
                        bgColor: '#ffffff',
                        textColor: '#000000',
                        sections: []
                    });
                    
                    // Initialize if null
                    if (!survey.value.sections) survey.value.sections = [];
                    if (!survey.value.surveyId) survey.value.surveyId = ''; // Empty for new
                    if (!survey.value.opened) survey.value.opened = 'OPENED';

                    const isSaving = ref(false);

                    // --- Actions ---
                    const addSection = () => {
                        // Generate temporary ID logic if needed, but for saving we rely on order
                        // Section ID logical assignment: max + 1
                        const maxId = survey.value.sections.length > 0 
                            ? Math.max(...survey.value.sections.map(s => s.sectionId || 0)) 
                            : 0;
                            
                        survey.value.sections.push({
                            sectionId: maxId + 1,
                            sectionTitle: '제목 없는 섹션',
                            questions: []
                        });
                    };

                    const removeSection = (idx) => {
                        if (confirm('섹션을 삭제하시겠습니까? 포함된 모든 질문이 삭제됩니다.')) {
                            survey.value.sections.splice(idx, 1);
                        }
                    };

                    const addQuestion = (section) => {
                        if (!section.questions) section.questions = [];
                        const maxId = section.questions.length > 0
                            ? Math.max(...section.questions.map(q => q.questionId || 0))
                            : 0;

                        section.questions.push({
                            questionId: maxId + 1,
                            questionType: 'inputRadio',
                            questionText: '',
                            labels: []
                        });
                    };

                    const removeQuestion = (section, idx) => {
                        section.questions.splice(idx, 1);
                    };

                    const addLabel = (question) => {
                        if (!question.labels) question.labels = [];
                        const maxId = question.labels.length > 0
                            ? Math.max(...question.labels.map(l => l.questionLabelId || 0))
                            : 0;
                            
                        question.labels.push({
                            questionLabelId: maxId + 1,
                            questionLabel: '',
                            selected: ''
                        });
                    };

                    const removeLabel = (question, idx) => {
                        question.labels.splice(idx, 1);
                    };

                    const saveSurvey = async () => {
                        if (!survey.value.surveyTitle) {
                            alert('설문 제목을 입력해주세요.');
                            return;
                        }

                        isSaving.value = true;
                        try {
                            // Re-index IDs to ensure sequential order before saving
                            survey.value.sections.forEach((s, sIdx) => {
                                s.sectionId = sIdx + 1;
                                if (s.questions) {
                                    s.questions.forEach((q, qIdx) => {
                                        q.sectionId = s.sectionId;
                                        q.questionId = qIdx + 1;
                                        if (q.labels) {
                                            q.labels.forEach((l, lIdx) => {
                                                l.sectionId = s.sectionId;
                                                l.questionId = q.questionId;
                                                l.questionLabelId = lIdx + 1;
                                            });
                                        }
                                    });
                                }
                            });

                            const response = await axios.post('/mgt/survey/saveEntryForm.do', survey.value);
                            const res = response.data;
                            
                            if (res.status === 'success') {
                                alert(res.message);
                                window.location.href = '/mgt/survey/selectPageListSurvey.do';
                            } else {
                                alert(res.message);
                            }
                        } catch (error) {
                            console.error('Save error:', error);
                            alert('저장 중 통신 오류가 발생했습니다.');
                        } finally {
                            isSaving.value = false;
                        }
                    };

                    const goList = () => {
                        window.location.href = '/mgt/survey/selectPageListSurvey.do';
                    };

                    onMounted(() => {
                        AdminMenu.init();
                    });

                    return {
                        survey, isSaving,
                        addSection, removeSection,
                        addQuestion, removeQuestion,
                        addLabel, removeLabel,
                        saveSurvey, goList
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#admin-survey-form');
        </script>
        
        <style>
            .dashed-border {
                border-style: dashed !important;
            }
            .form-control-color {
                height: 38px;
            }
        </style>
    </div>
</body>
</html>
