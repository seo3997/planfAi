<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-survey-master}, ~{::#admin-survey-script}, ~{})}">
<head>
    <title>설문 마스터 관리 - PlanfAi 관리자</title>
</head>
<body>
    <div id="admin-survey-master">
        <!-- Workspace Header -->
        <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link text-dark p-0 text-decoration-none" @click="goList">
                    <i class="bi bi-arrow-left fs-4"></i>
                </button>
                <h4 class="m-0 fw-bold">{{ survey.surveyTitle }}</h4>
                <span class="badge bg-secondary rounded-pill">{{ survey.surveyId }}</span>
            </div>
            <div class="d-flex gap-2">
                 <button type="button" class="btn btn-outline-secondary" @click="goPreview">
                    <i class="bi bi-eye me-1"></i> 미리보기
                </button>
                <button type="button" class="btn btn-primary" @click="saveMaster" :disabled="isSaving || survey.opened === 'OPENED'">
                    <span v-if="isSaving" class="spinner-border spinner-border-sm me-1"></span>
                    저장
                </button>
            </div>
        </div>

        <!-- Workspace Tabs -->
        <ul class="nav nav-tabs nav-fill mb-4 border-bottom-0">
            <li class="nav-item">
                <a class="nav-link active fw-bold border-bottom border-main border-3 text-main" href="javascript:void(0);">
                    설정 (Settings)
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" :class="survey.opened === 'OPENED' ? 'disabled text-secondary opacity-50' : 'text-muted'" 
                   :href="survey.opened === 'OPENED' ? 'javascript:void(0)' : '/mgt/survey/editEntryForm.do?surveyId=' + survey.surveyId">
                    질문 (Questions)
                    <i v-if="survey.opened === 'OPENED'" class="bi bi-lock-fill small ms-1"></i>
                </a>
            </li>
             <li class="nav-item">
                <a class="nav-link text-muted" :href="survey.surveyId ? '/mgt/survey/surveyStats.do?surveyId=' + survey.surveyId : '#'">
                    응답 (Responses)
                </a>
            </li>
        </ul>

        <div class="mgmt-card border-top-0 pt-0">
            <form @submit.prevent="saveMaster">
                <!-- Tabs -->
                <ul class="nav nav-pills mb-4 bg-light p-2 rounded">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="pill" href="#basic-info">기본 정보</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="pill" href="#access-control">권한 설정</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="pill" href="#theme-design">테마/디자인</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="pill" href="#text-setup">문구 설정</a>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- 1. Basic Info -->
                    <div class="tab-pane fade show active" id="basic-info">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">설문 ID</label>
                                <input type="text" class="form-control" v-model="survey.surveyId" readonly disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">설문 제목 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" v-model="survey.surveyTitle" required :disabled="survey.opened === 'OPENED'">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">상태</label>
                                <select class="form-select" v-model="survey.opened">
                                    <option value="DRAFT">설문문항작성중 (DRAFT)</option>
                                    <option value="OPENED">설문중 (OPENED)</option>
                                    <option value="CLOSED">마감 (CLOSED)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">마감일</label>
                                <input type="date" class="form-control" v-model="survey.closed" :disabled="survey.opened === 'OPENED'">
                            </div>
                        </div>

                        <!-- 8-1. Survey Deployment URL: Shown when OPENED or CLOSED -->
                        <div class="row mb-4" v-if="(survey.opened === 'OPENED' || survey.opened === 'CLOSED') && survey.surveyId">
                            <div class="col-md-12">
                                <div class="bg-light p-3 rounded border" :class="survey.opened === 'OPENED' ? 'border-success border-opacity-25' : 'border-warning border-opacity-25'">
                                    <label class="form-label fw-bold d-flex align-items-center gap-2" :class="survey.opened === 'OPENED' ? 'text-success' : 'text-warning'">
                                        <i class="bi bi-broadcast fs-5"></i> 
                                        설문 배포 URL <span v-if="survey.opened === 'OPENED'">(수집 중)</span><span v-else>(마감됨)</span>
                                    </label>
                                    <div class="input-group">
                                        <input type="text" class="form-control bg-white fw-bold" 
                                               :value="(surveyDomain.startsWith('http') ? '' : 'https://') + surveyDomain + '/survey/v/' + survey.surveyId" readonly>
                                        <button class="btn btn-primary" type="button" @click="copyToClipboard((surveyDomain.startsWith('http') ? '' : 'https://') + surveyDomain + '/survey/v/' + survey.surveyId)">
                                            <i class="bi bi-clipboard me-1"></i> 복사
                                        </button>
                                        <a :href="(surveyDomain.startsWith('http') ? '' : 'https://') + surveyDomain + '/survey/v/' + survey.surveyId" target="_blank" class="btn btn-outline-success">
                                            <i class="bi bi-box-arrow-up-right"></i> 바로가기
                                        </a>
                                    </div>
                                    <p class="small text-muted mt-2 mb-0">
                                        <i class="bi bi-info-circle me-1"></i> 
                                        <span v-if="survey.opened === 'OPENED'">현재 설문이 활성화 상태입니다. 위 주소를 응답자에게 공유하여 데이터를 수집하세요.</span>
                                        <span v-else>현재 설문이 마감되었습니다. 기존 URL 확인을 위해 정보를 유지합니다.</span>
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">담당자 이메일</label>
                                <input type="email" class="form-control" v-model="survey.adminEmail">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">담당자 ID</label>
                                <input type="text" class="form-control" v-model="survey.adminPid">
                            </div>
                        </div>
                    </div>

                    <!-- 2. Access Control -->
                    <div class="tab-pane fade" id="access-control">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">결과 조회 암호</label>
                                <input type="text" class="form-control" v-model="survey.resultsPassword" placeholder="입력 시 결과 조회 제한" :disabled="survey.opened === 'OPENED'">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">참여 암호</label>
                                <input type="text" class="form-control" v-model="survey.entryPassword" placeholder="입력 시 참여 제한" :disabled="survey.opened === 'OPENED'">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label class="form-label">IP 접근 제한</label>
                                <input type="text" class="form-control" v-model="survey.ip" placeholder="허용 IP 목록 (콤마 구분)" :disabled="survey.opened === 'OPENED'">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch mt-4">
                                    <input class="form-check-input" type="checkbox" id="oneEntryOnly" v-model="survey.oneEntryOnly" true-value="Y" false-value="N" :disabled="survey.opened === 'OPENED'">
                                    <label class="form-check-label" for="oneEntryOnly">1인 1회 참여 제한</label>
                                </div>
                            </div>
                        </div>
                    </div>

                     <!-- 3. Theme/Design -->
                    <div class="tab-pane fade" id="theme-design">
                         <!-- Theme Selection -->
                         <div class="mb-4">
                            <label class="form-label fw-bold">기본 테마 선택</label>
                            <div class="d-flex flex-nowrap overflow-auto pb-2 gap-3" style="scrollbar-width: thin;">
                                <!-- Reset Theme -->
                                <div style="min-width: 140px; flex: 0 0 auto;">
                                    <div class="theme-card-simple border rounded p-2 text-center" 
                                         :class="{'border-primary bg-light shadow-sm': !survey.themeSeq}"
                                         @click="resetTheme"
                                         style="cursor: pointer;">
                                        <div class="d-flex align-items-center justify-content-center bg-white rounded mb-2" style="height: 60px; border: 1px dashed #dee2e6;">
                                            <i class="bi bi-arrow-counterclockwise fs-4 text-muted"></i>
                                        </div>
                                        <div class="small fw-bold">테마 해제</div>
                                    </div>
                                </div>
                                <!-- Theme List -->
                                <div v-for="theme in themeList" :key="theme.themeSeq" style="min-width: 140px; flex: 0 0 auto;">
                                    <div class="theme-card-simple border rounded p-2 text-center" 
                                         :class="{'border-primary bg-light shadow-sm': survey.themeSeq === theme.themeSeq}"
                                         @click="applyTheme(theme)"
                                         style="cursor: pointer;">
                                        <img :src="theme.themeImagePath" class="img-fluid rounded mb-2" :alt="theme.themeName" style="height: 60px; object-fit: cover;">
                                        <div class="small fw-bold">{{ theme.themeName }}</div>
                                    </div>
                                </div>
                            </div>
                         </div>

                         <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">레이아웃 유형</label>
                                <select class="form-select" v-model="survey.layoutType">
                                    <option value="CENTER">중앙 집중형 (Center)</option>
                                    <option value="TOP_BANNER">상단 배너형 (Top Banner)</option>
                                    <option value="LEFT_1_3">좌측 1/3 분할형 (Side)</option>
                                    <option value="RIGHT_1_2">우측 1/2 분할형</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">브랜드 정렬</label>
                                <select class="form-select" v-model="survey.logoAlign">
                                    <option value="LEFT">왼쪽 (Left)</option>
                                    <option value="CENTER">가운데 (Center)</option>
                                    <option value="RIGHT">오른쪽 (Right)</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check form-switch mt-4">
                                    <input class="form-check-input" type="checkbox" id="showFooterLogo" v-model="survey.showFooterLogo" true-value="Y" false-value="N">
                                    <label class="form-check-label" for="showFooterLogo">푸터 서비스 로고 노출</label>
                                </div>
                            </div>
                         </div>

                         <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">배경색</label>
                                <input type="color" class="form-control form-control-color w-100" v-model="survey.bgColor">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">글자색</label>
                                <input type="color" class="form-control form-control-color w-100" v-model="survey.textColor">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">강조 색상 (Accent)</label>
                                <input type="color" class="form-control form-control-color w-100" v-model="survey.accentColor">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">폰트 크기</label>
                                <input type="text" class="form-control" v-model="survey.fontSize" placeholder="예: 14px">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">로고 이미지</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" v-model="survey.logoImagePath" placeholder="/static/images/logo.png" readonly>
                                    <input type="file" id="logoUpload" class="d-none" accept="image/*" @change="handleFileUpload($event, 'logo')">
                                    <button class="btn btn-outline-secondary" type="button" @click="document.getElementById('logoUpload').click()">
                                        <i class="bi bi-cloud-upload"></i> 업로드
                                    </button>
                                </div>
                                <div v-if="survey.logoImagePath" class="mt-2">
                                    <img :src="survey.logoImagePath" class="img-thumbnail" style="max-height: 50px;">
                                    <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none" @click="survey.logoImagePath = ''">삭제</button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">배경 이미지</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" v-model="survey.bgImagePath" placeholder="배경 이미지 URL" readonly>
                                    <input type="file" id="bgUpload" class="d-none" accept="image/*" @change="handleFileUpload($event, 'background')">
                                    <button class="btn btn-outline-secondary" type="button" @click="document.getElementById('bgUpload').click()">
                                        <i class="bi bi-cloud-upload"></i> 업로드
                                    </button>
                                </div>
                                <div v-if="survey.bgImagePath" class="mt-2">
                                    <img :src="survey.bgImagePath" class="img-thumbnail" style="max-height: 50px;">
                                    <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none" @click="survey.bgImagePath = ''">삭제</button>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">적용 폰트 (Font Family)</label>
                                <input type="text" class="form-control" v-model="survey.fontFamily" placeholder="예: 'Pretendard', sans-serif">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch mt-4">
                                    <input class="form-check-input" type="checkbox" id="showBorder" v-model="survey.showBorder" true-value="Y" false-value="N">
                                    <label class="form-check-label" for="showBorder">본문 테두리 표시</label>
                                </div>
                            </div>
                        </div>

                         <div class="mb-3">
                              <label class="form-label">헤더 (Header HTML)</label>
                              <textarea class="form-control" rows="3" v-model="survey.header" placeholder="설문 상단 HTML 안내문구 등"></textarea>
                         </div>
                         <div class="mb-3">
                              <label class="form-label">푸터 (Footer HTML)</label>
                              <textarea class="form-control" rows="3" v-model="survey.footer" placeholder="설문 하단 HTML 또는 저작권 표시"></textarea>
                         </div>
                         <div class="mb-3">
                              <label class="form-label">사용자 커스텀 CSS</label>
                              <textarea class="form-control" rows="3" v-model="survey.userCss" placeholder=".survey-title { font-weight: 800; }"></textarea>
                         </div>
                    </div>

                    <!-- 4. Text Setup -->
                    <div class="tab-pane fade" id="text-setup">
                        <div class="mb-3">
                             <label class="form-label">종료 페이지 문구</label>
                             <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="exitPageTextIsHtml" v-model="survey.exitPageTextIsHtml" true-value="Y" false-value="N">
                                <label class="form-check-label" for="exitPageTextIsHtml">HTML 사용</label>
                             </div>
                             <textarea class="form-control" rows="5" v-model="survey.exitPageText"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-survey-script">
        <script th:inline="javascript">
            /*<![CDATA[*/
            const serverSurveyInfo = /*[[${surveyInfo}]]*/ {};
            const serverThemeList = /*[[${themeList}]]*/ [];
            const serverSurveyDomain = /*[[${surveyDomain}]]*/ 'www.planf.shop';
            /*]]>*/

            const initVueApp = true; // IMPORTANT
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const survey = ref(serverSurveyInfo || {});
                    const themeList = ref(serverThemeList || []);
                    const surveyDomain = ref(serverSurveyDomain);
                    const isSaving = ref(false);

                    // Initialize defaults if null
                    if (!survey.value.opened) survey.value.opened = 'DRAFT';
                    if (!survey.value.oneEntryOnly) survey.value.oneEntryOnly = 'N';
                    if (!survey.value.showBorder) survey.value.showBorder = 'N';
                    if (!survey.value.exitPageTextIsHtml) survey.value.exitPageTextIsHtml = 'N';
                    if (!survey.value.logoAlign) survey.value.logoAlign = 'LEFT';
                    if (!survey.value.layoutType) survey.value.layoutType = 'CENTER';
                    if (!survey.value.showFooterLogo) survey.value.showFooterLogo = 'Y';
                    if (!survey.value.accentColor) survey.value.accentColor = '#2b4b8a';
                    
                    // Format date for input type="date" (YYYY-MM-DD)
                    if (survey.value.closed && survey.value.closed.length > 10) {
                         survey.value.closed = survey.value.closed.substring(0, 10);
                    }

                    const resetTheme = () => {
                        survey.value.themeSeq = null;
                        survey.value.bgImagePath = '';
                        survey.value.bgColor = '#ffffff';
                        survey.value.textColor = '#212529';
                        survey.value.accentColor = '#2b4b8a';
                        survey.value.layoutType = 'CENTER';
                    };

                    const applyTheme = (theme) => {
                        survey.value.themeSeq = theme.themeSeq;
                        survey.value.bgColor = theme.bgColor;
                        survey.value.textColor = theme.textColor;
                        survey.value.accentColor = theme.accentColor || '#2b4b8a';
                        survey.value.layoutType = theme.layoutType;
                        survey.value.bgImagePath = theme.bgImagePath;
                        // Add theme default styles to userCss if needed or handle separately
                    };

                    const handleFileUpload = async (event, type) => {
                        const file = event.target.files[0];
                        if (!file) return;

                        const formData = new FormData();
                        formData.append('file', file);
                        
                        try {
                            const response = await axios.post('/survey/upload-image?surveyId=' + survey.value.surveyId, formData);
                            if (response.data.status === 'success') {
                                if (type === 'logo') {
                                    survey.value.logoImagePath = response.data.fullUrl;
                                } else {
                                    survey.value.bgImagePath = response.data.fullUrl;
                                }
                            } else {
                                alert(response.data.message);
                            }
                        } catch (error) {
                            console.error('Upload error:', error);
                            alert('이미지 업로드에 실패했습니다.');
                        }
                    };

                    const saveMaster = async () => {
                        if (!survey.value.surveyTitle) {
                            alert('설문 제목을 입력해주세요.');
                            return;
                        }

                        isSaving.value = true;
                        try {
                            const response = await axios.post('/mgt/survey/updateSurveyMaster.do', survey.value);
                            const res = response.data;
                            
                            if (res.status === 'success') {
                                alert(res.message);
                                window.location.reload();
                            } else {
                                alert(res.message);
                            }
                        } catch (error) {
                            console.error('Save error:', error);
                            alert('저장 중 통신 오류가 발생했습니다.');
                        } finally {
                            isSaving.value = false;
                        }
                    };

                    const goList = () => {
                        window.location.href = '/mgt/survey/selectPageListSurvey.do';
                    };

                    const goEntryForm = () => {
                        window.location.href = `/mgt/survey/editEntryForm.do?surveyId=${survey.value.surveyId}`;
                    };

                    const goPreview = () => {
                        const url = `/mgt/survey/preview.do?surveyId=${survey.value.surveyId}`;
                        window.open(url, '_blank', 'width=1024,height=800,scrollbars=yes');
                    };

                    const copyToClipboard = (text) => {
                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(text).then(() => {
                                alert('주소가 클립보드에 복사되었습니다.');
                            });
                        } else {
                            // Fallback
                            const textArea = document.createElement("textarea");
                            textArea.value = text;
                            document.body.appendChild(textArea);
                            textArea.select();
                            document.execCommand("copy");
                            document.body.removeChild(textArea);
                            alert('주소가 클립보드에 복사되었습니다.');
                        }
                    };

                    onMounted(() => {
                        AdminMenu.init();

                        // Tab Persistence
                        const activeTab = localStorage.getItem('surveyActiveTab');
                        if (activeTab) {
                            const tabEl = document.querySelector(`a[href="${activeTab}"]`);
                            if (tabEl) {
                                const tab = new bootstrap.Tab(tabEl);
                                tab.show();
                            }
                        }

                        // Listen for tab changes
                        const tabLinks = document.querySelectorAll('a[data-bs-toggle="pill"]');
                        tabLinks.forEach(link => {
                            link.addEventListener('shown.bs.tab', (e) => {
                                const target = e.target.getAttribute('href');
                                localStorage.setItem('surveyActiveTab', target);
                            });
                        });
                    });

                    return {
                        survey, themeList, surveyDomain, isSaving,
                        saveMaster, goList, goEntryForm, goPreview, applyTheme, resetTheme, copyToClipboard, handleFileUpload
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
        
        <style>
            :root {
                --main-color: #2b4b8a;
                --sub-primary: #49a7b0;
            }
            .text-main {
                color: var(--main-color) !important;
            }
            .bg-main {
                background-color: var(--main-color) !important;
            }
            .border-main {
                border-color: var(--main-color) !important;
            }
            .nav-tabs .nav-link.active {
                color: var(--main-color) !important;
                border-bottom: 3px solid var(--main-color) !important;
            }
            .nav-pills .nav-link.active {
                background-color: var(--sub-primary) !important;
                color: #fff !important;
            }
            .form-control-color {
                height: 38px;
            }
            .theme-card-simple:hover {
                border-color: var(--sub-primary) !important;
            }
        </style>
    </div>
