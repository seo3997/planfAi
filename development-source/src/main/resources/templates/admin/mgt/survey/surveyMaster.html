<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-survey-master}, ~{::#admin-survey-script}, ~{})}">
<head>
    <title>설문 마스터 관리 - PlanfAi 관리자</title>
</head>
<body>
    <div id="admin-survey-master">
        <!-- Workspace Header -->
        <div class="d-flex justify-content-between align-items-center mb-3 mt-3">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link text-dark p-0 text-decoration-none" @click="goList">
                    <i class="bi bi-arrow-left fs-4"></i>
                </button>
                <h4 class="m-0 fw-bold">{{ survey.surveyTitle }}</h4>
                <span class="badge bg-secondary rounded-pill">{{ survey.surveyId }}</span>
            </div>
            <div class="d-flex gap-2">
                 <button type="button" class="btn btn-outline-secondary" @click="goPreview">
                    <i class="bi bi-eye me-1"></i> 미리보기
                </button>
                <button type="button" class="btn btn-primary" @click="saveMaster" :disabled="isSaving">
                    <span v-if="isSaving" class="spinner-border spinner-border-sm me-1"></span>
                    저장
                </button>
            </div>
        </div>

        <!-- Workspace Tabs -->
        <ul class="nav nav-tabs nav-fill mb-4 border-bottom-0">
            <li class="nav-item">
                <a class="nav-link active fw-bold border-bottom border-main border-3 text-main" href="javascript:void(0);">
                    설정 (Settings)
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-muted" :href="survey.surveyId ? '/mgt/survey/editEntryForm.do?surveyId=' + survey.surveyId : '#'">
                    질문 (Questions)
                </a>
            </li>
             <li class="nav-item">
                <a class="nav-link disabled text-muted" href="#">
                    응답 (Responses)
                </a>
            </li>
        </ul>

        <div class="mgmt-card border-top-0 pt-0">
            <form @submit.prevent="saveMaster">
                <!-- Tabs -->
                <ul class="nav nav-pills mb-4 bg-light p-2 rounded">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="pill" href="#basic-info">기본 정보</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="pill" href="#access-control">권한 설정</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="pill" href="#theme-design">테마/디자인</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="pill" href="#text-setup">문구 설정</a>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- 1. Basic Info -->
                    <div class="tab-pane fade show active" id="basic-info">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">설문 ID</label>
                                <input type="text" class="form-control" v-model="survey.surveyId" readonly disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">설문 제목 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" v-model="survey.surveyTitle" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">상태</label>
                                <select class="form-select" v-model="survey.opened">
                                    <option value="OPENED">진행중 (OPENED)</option>
                                    <option value="CLOSED">마감 (CLOSED)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">마감일</label>
                                <input type="date" class="form-control" v-model="survey.closed">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">담당자 이메일</label>
                                <input type="email" class="form-control" v-model="survey.adminEmail">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">담당자 ID</label>
                                <input type="text" class="form-control" v-model="survey.adminPid">
                            </div>
                        </div>
                    </div>

                    <!-- 2. Access Control -->
                    <div class="tab-pane fade" id="access-control">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">결과 조회 암호</label>
                                <input type="text" class="form-control" v-model="survey.resultsPassword" placeholder="입력 시 결과 조회 제한">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">참여 암호</label>
                                <input type="text" class="form-control" v-model="survey.entryPassword" placeholder="입력 시 참여 제한">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label class="form-label">IP 접근 제한</label>
                                <input type="text" class="form-control" v-model="survey.ip" placeholder="허용 IP 목록 (콤마 구분)">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-check form-switch mt-4">
                                    <input class="form-check-input" type="checkbox" id="oneEntryOnly" v-model="survey.oneEntryOnly" true-value="Y" false-value="N">
                                    <label class="form-check-label" for="oneEntryOnly">1인 1회 참여 제한</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Theme/Design -->
                    <div class="tab-pane fade" id="theme-design">
                         <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">배경색</label>
                                <input type="color" class="form-control form-control-color w-100" v-model="survey.bgColor">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">글자색</label>
                                <input type="color" class="form-control form-control-color w-100" v-model="survey.textColor">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">폰트 크기</label>
                                <input type="text" class="form-control" v-model="survey.fontSize" placeholder="예: 14px">
                            </div>
                            <div class="col-md-3">
                                <div class="form-check form-switch mt-4">
                                    <input class="form-check-input" type="checkbox" id="showBorder" v-model="survey.showBorder" true-value="Y" false-value="N">
                                    <label class="form-check-label" for="showBorder">테두리 표시</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                             <label class="form-label">헤더 (Header HTML)</label>
                             <textarea class="form-control" rows="3" v-model="survey.header"></textarea>
                        </div>
                        <div class="mb-3">
                             <label class="form-label">푸터 (Footer HTML)</label>
                             <textarea class="form-control" rows="3" v-model="survey.footer"></textarea>
                        </div>
                        <div class="mb-3">
                             <label class="form-label">사용자 CSS</label>
                             <textarea class="form-control" rows="3" v-model="survey.userCss"></textarea>
                        </div>
                    </div>

                    <!-- 4. Text Setup -->
                    <div class="tab-pane fade" id="text-setup">
                        <div class="mb-3">
                             <label class="form-label">종료 페이지 문구</label>
                             <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="exitPageTextIsHtml" v-model="survey.exitPageTextIsHtml" true-value="Y" false-value="N">
                                <label class="form-check-label" for="exitPageTextIsHtml">HTML 사용</label>
                             </div>
                             <textarea class="form-control" rows="5" v-model="survey.exitPageText"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-survey-script">
        <script th:inline="javascript">
            /*<![CDATA[*/
            const serverSurveyInfo = /*[[${surveyInfo}]]*/ {};
            /*]]>*/

            const initVueApp = true; // IMPORTANT
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const survey = ref(serverSurveyInfo || {});
                    const isSaving = ref(false);

                    // Initialize defaults if null
                    if (!survey.value.opened) survey.value.opened = 'OPENED';
                    if (!survey.value.oneEntryOnly) survey.value.oneEntryOnly = 'N';
                    if (!survey.value.showBorder) survey.value.showBorder = 'N';
                    if (!survey.value.exitPageTextIsHtml) survey.value.exitPageTextIsHtml = 'N';
                    
                    // Format date for input type="date" (YYYY-MM-DD)
                    if (survey.value.closed && survey.value.closed.length > 10) {
                         survey.value.closed = survey.value.closed.substring(0, 10);
                    }

                    const saveMaster = async () => {
                        if (!survey.value.surveyTitle) {
                            alert('설문 제목을 입력해주세요.');
                            return;
                        }

                        isSaving.value = true;
                        try {
                            const response = await axios.post('/mgt/survey/updateSurveyMaster.do', survey.value);
                            const res = response.data;
                            
                            if (res.status === 'success') {
                                alert(res.message);
                                window.location.reload();
                            } else {
                                alert(res.message);
                            }
                        } catch (error) {
                            console.error('Save error:', error);
                            alert('저장 중 통신 오류가 발생했습니다.');
                        } finally {
                            isSaving.value = false;
                        }
                    };

                    const goList = () => {
                        window.location.href = '/mgt/survey/selectPageListSurvey.do';
                    };

                    const goEntryForm = () => {
                        window.location.href = `/mgt/survey/editEntryForm.do?surveyId=${survey.value.surveyId}`;
                    };

                    const goPreview = () => {
                        const url = `/mgt/survey/preview.do?surveyId=${survey.value.surveyId}`;
                        window.open(url, '_blank', 'width=1024,height=800,scrollbars=yes');
                    };

                    onMounted(() => {
                        AdminMenu.init();
                    });

                    return {
                        survey, isSaving,
                        saveMaster, goList, goEntryForm, goPreview
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
        
        <style>
            :root {
                --main-color: #2b4b8a;
            }
            .text-main {
                color: var(--main-color) !important;
            }
            .bg-main {
                background-color: var(--main-color) !important;
            }
            .border-main {
                border-color: var(--main-color) !important;
            }
            .nav-tabs .nav-link.active {
                color: var(--main-color) !important;
                border-bottom: 3px solid var(--main-color) !important;
            }
            .form-control-color {
                height: 38px;
            }
        </style>
    </div>
</body>
</html>
