<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-main-content}, ~{::#admin-main-script}, ~{})}"
      th:with="noSidebar=true">
<head>
    <title>관리자 메인 - PlanfAi</title>
</head>
<body>
    <div id="admin-main-content">
        <div class="dash-row">
            <!-- Left Section: Summary -->
            <div class="dash-section summary-section">
                <div class="dash-title">주요 현황</div>
                
                <b-card class="dash-card blue shadow-sm border-0 mb-3">
                    <div class="card-label">회원수</div>
                    <div class="card-value">
                        <span class="accrue">1</span>
                        <span class="accrue-unit">명</span>
                    </div>
                </b-card>

                <b-card class="dash-card green shadow-sm border-0 mb-3">
                    <div class="card-label">소상공인 수익 분석 리포트 건수</div>
                    <div class="card-value">
                        <span class="accrue">1</span>
                        <span class="accrue-unit">건</span>
                    </div>
                </b-card>
            </div>

            <!-- Right Section: Board -->
            <div class="dash-section flex-grow-1">
                <b-card class="mgmt-card shadow-sm border-0 h-100">
                    <template #header>
                        <div class="d-flex justify-content-between align-items-center">
                            <h3 class="section-title mb-0">공지사항</h3>
                            <b-button variant="outline-primary" size="sm" class="rounded-circle p-0" style="width: 24px; height: 24px;">
                                <i class="bi bi-plus"></i>
                            </b-button>
                        </div>
                    </template>
                    
                    <div class="data-table-wrapper">
                    <table class="data-table">
                        <thead style="background-color: #f9f9f9;">
                            <tr>
                                <th style="width: 80px;">No</th>
                                <th>제목</th>
                                <th style="width: 150px;">등록자</th>
                                <th style="width: 150px;">등록일자</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td class="text-start px-3">미리보는 트렌드코리아 22</td>
                                <td>soohyun</td>
                                <td>2022.12.08</td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                </b-card>
            </div>
        </div>
    </div>

    <div id="admin-main-script">
        <script>
            // No custom logic needed for dashboard other than default
        </script>
    </div>
</body>
</html>
