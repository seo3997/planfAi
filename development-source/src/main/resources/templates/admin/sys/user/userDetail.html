<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-user-content}, ~{::#admin-user-script}, ~{})}">
<head>
    <title>사용자 상세 - PlanfAi 관리자</title>
</head>
<body>
    <div id="admin-user-content">
        <div class="page-title-box">
            <h2 class="page-title">사용자조회</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 기본정보 > <span class="text-primary fw-medium">사용자</span>
            </div>
        </div>

        <div class="form-section mgmt-card">
            <h3 class="section-title">회원기본정보</h3>
            <div class="detail-box">
                <div class="detail-row">
                    <div class="detail-label">사용자ID</div>
                    <div class="detail-content">{{ user.userId }}</div>
                    <div class="detail-label">등록일</div>
                    <div class="detail-content">{{ formatDate(user.registDt) }}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">사용자 권한</div>
                    <div class="detail-content">{{ user.authorNm }}</div>
                    <div class="detail-label">사용자 상태</div>
                    <div class="detail-content">{{ user.userSttusNm }}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">이름</div>
                    <div class="detail-content">{{ user.userNm }}</div>
                    <div class="detail-label">연락처</div>
                    <div class="detail-content">{{ user.cttpc }}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">이메일</div>
                    <div class="detail-content">{{ user.email }}</div>
                    <div class="detail-label">지역</div>
                    <div class="detail-content">{{ user.areaNm }} {{ user.areaSeNm }}</div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4 mb-5">
            <button class="btn btn-list" @click="goList"><i class="bi bi-reply"></i> 목록</button>
            <button class="btn btn-edit" @click="goEdit"><i class="bi bi-pencil-square"></i> 수정</button>
            <button class="btn btn-delete" @click="deleteUser"><i class="bi bi-trash"></i> 삭제</button>
        </div>
    </div>

    <div id="admin-user-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const user = ref({});
                    const userNo = new URLSearchParams(window.location.search).get('userNo');

                    const fetchUserDetail = () => {
                        if(!userNo) return;
                        axios.get(`/api/admin/user/${userNo}`)
                            .then(res => user.value = res.data);
                    };

                    const formatDate = (dt) => {
                        if (!dt) return '';
                        return dt.split(/[ T]/)[0].replace(/-/g, '.');
                    };

                    const goList = () => location.href = '/admin/user/selectPageListUserMgt.do';
                    const goEdit = () => location.href = `/admin/user/updateFormUserMgt.do?userNo=${userNo}`;
                    
                    const deleteUser = () => {
                        if (confirm('정말 삭제하시겠습니까?')) {
                            axios.delete(`/api/admin/user/${userNo}`)
                                .then(() => {
                                    alert('삭제되었습니다.');
                                    goList();
                                });
                        }
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchUserDetail();
                    });

                    return { user, formatDate, goList, goEdit, deleteUser };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
