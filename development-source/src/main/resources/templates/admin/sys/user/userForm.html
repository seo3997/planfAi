<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-user-content}, ~{::#admin-user-script}, ~{})}">
<head>
    <title>사용자 등록 - PlanfAi 관리자</title>
</head>
<body>
    <div id="admin-user-content">
        <div class="page-title-box">
            <h2 class="page-title">사용자 등록</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 기본정보 > <span class="text-primary fw-medium">사용자</span>
            </div>
        </div>

        <div class="form-section mgmt-card">
            <h3 class="section-title">기본정보</h3>
            <div class="detail-box">
                <div class="detail-row">
                    <div class="detail-label required">사용자ID</div>
                    <div class="detail-content">
                        <input type="text" class="form-control" v-model="user.userId" placeholder="사용자ID" style="width: 350px;">
                    </div>
                    <div class="detail-label required">비밀번호</div>
                    <div class="detail-content">
                        <input type="password" class="form-control" v-model="user.password" placeholder="비밀번호" style="width: 350px;">
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label required">이름</div>
                    <div class="detail-content">
                        <input type="text" class="form-control" v-model="user.userNm" placeholder="이름" style="width: 350px;">
                    </div>
                    <div class="detail-label required">연락처</div>
                    <div class="detail-content">
                        <div class="input-group-contact">
                            <input type="text" class="form-control text-center" v-model="contact.part1">
                            <span>-</span>
                            <input type="text" class="form-control text-center" v-model="contact.part2">
                            <span>-</span>
                            <input type="text" class="form-control text-center" v-model="contact.part3">
                        </div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label required">이메일</div>
                    <div class="detail-content">
                        <input type="email" class="form-control" v-model="user.email" placeholder="이메일" style="width: 350px;">
                    </div>
                    <div class="detail-label">사용자 상태</div>
                    <div class="detail-content">
                        <select class="form-select" v-model="user.userSttusCode" style="width: 350px;">
                            <option v-for="st in statusCodes" :key="st.CODE" :value="st.CODE">{{ st.CODE_NM }}</option>
                        </select>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">지역</div>
                    <div class="detail-content full-width">
                        <div class="d-flex gap-2">
                            <select class="form-select" v-model="user.areaCode" @change="onAreaChange" style="width: 200px;">
                                <option value="">중분류 선택</option>
                                <option v-for="area in areaCodes" :key="area.CODE" :value="area.CODE">{{ area.CODE_NM }}</option>
                            </select>
                            <select class="form-select" v-model="user.areaSeCodeS" style="width: 200px;">
                                <option value="">소분류 선택</option>
                                <option v-for="sub in subAreaCodes" :key="sub.CODE" :value="sub.CODE">{{ sub.CODE_NM }}</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section mgmt-card">
            <h3 class="section-title">권한선택</h3>
            <div class="p-4">
                <div class="radio-group">
                    <label v-for="auth in authors" :key="auth.AUTHOR_ID">
                        <input type="radio" v-model="user.authorId" :value="auth.AUTHOR_ID"> {{ auth.AUTHOR_NM }}
                    </label>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4 mb-5">
            <b-button variant="outline-secondary" @click="goList"><i class="bi bi-reply me-1"></i>목록</b-button>
            <b-button variant="primary" class="px-5" @click="saveUser">등록</b-button>
        </div>
    </div>

    <div id="admin-user-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const authors = ref([]);
                    const statusCodes = ref([]);
                    const areaCodes = ref([]);
                    const subAreaCodes = ref([]);
                    const user = ref({
                        userId: '',
                        password: '',
                        userNm: '',
                        email: '',
                        userSttusCode: '',
                        authorId: '',
                        areaCode: '',
                        areaSeCodeS: ''
                    });
                    
                    const contact = ref({ part1: '', part2: '', part3: '' });

                    const fetchAuthors = () => {
                        axios.get('/api/admin/user/authors')
                            .then(res => {
                                authors.value = res.data;
                                if (authors.value.length > 0) {
                                    user.value.authorId = authors.value[0].AUTHOR_ID;
                                }
                            });
                    };

                    const fetchStatusCodes = async () => {
                        statusCodes.value = await AdminCode.getCodes('R010050');
                        if (statusCodes.value.length > 0) {
                            user.value.userSttusCode = statusCodes.value[0].CODE;
                        }
                    };

                    const fetchAreas = async () => {
                        areaCodes.value = await AdminCode.getCodes('R010070');
                    };

                    const onAreaChange = async () => {
                        user.value.areaSeCodeS = '';
                        subAreaCodes.value = [];
                        if (user.value.areaCode) {
                            subAreaCodes.value = await AdminCode.getSclasCodes('R010070', user.value.areaCode);
                        }
                    };

                    const saveUser = () => {
                        if (user.value.userId) user.value.userId = user.value.userId.replace(/\s/g, '');
                        if (user.value.password) user.value.password = user.value.password.replace(/\s/g, '');
                        if (user.value.userNm) user.value.userNm = user.value.userNm.replace(/\s/g, '');
                        if (user.value.email) user.value.email = user.value.email.replace(/\s/g, '');

                        if (!user.value.userId) return alert('아이디를 입력해주세요.');
                        if (!user.value.password) return alert('비밀번호를 입력해주세요.');
                        
                        user.value.cttpc = `${contact.value.part1}-${contact.value.part2}-${contact.value.part3}`;
                        
                        axios.post('/api/admin/user', user.value)
                            .then(res => {
                                alert('등록되었습니다.');
                                location.href = '/admin/user/selectPageListUserMgt.do';
                            }).catch(err => alert('등록 중 오류 발생'));
                    };

                    const goList = () => location.href = '/admin/user/selectPageListUserMgt.do';

                    onMounted(() => {
                        AdminMenu.init();
                        fetchAuthors();
                        fetchStatusCodes();
                        fetchAreas();
                    });

                    return { authors, statusCodes, areaCodes, subAreaCodes, user, contact, onAreaChange, saveUser, goList };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
