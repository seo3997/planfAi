<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-user-content}, ~{::#admin-user-script}, ~{})}">
<head>
    <title>사용자 관리 - PlanfAi 관리자</title>
</head>
<body>
    <div id="admin-user-content">
        <div class="page-title-box">
            <h2 class="page-title">사용자</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 기본정보 > <span class="text-primary fw-medium">사용자</span>
            </div>
        </div>

        <div class="mgmt-card">
            <!-- Search Area -->
            <!-- Search Area (Refactored to Div-based) -->
            <div class="search-filter-box">
                <div class="filter-row">
                    <div class="filter-item">
                        <div class="filter-label">사용자 상태</div>
                        <div class="filter-content">
                            <select class="form-select form-select-sm" v-model="searchDto.searchStatus">
                                <option value="전체">전체</option>
                                <option v-for="st in statusCodes" :key="st.CODE" :value="st.CODE">{{ st.CODE_NM }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="filter-item">
                        <div class="filter-label">권한명</div>
                        <div class="filter-content">
                            <select class="form-select form-select-sm" v-model="searchDto.searchAuthor">
                                <option value="전체">전체</option>
                                <option v-for="auth in authors" :key="auth.AUTHOR_ID" :value="auth.AUTHOR_ID">{{ auth.AUTHOR_NM }}</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="filter-row">
                    <div class="filter-item">
                        <div class="filter-label">상세검색</div>
                        <div class="filter-content">
                            <select class="form-select form-select-sm" style="width: 120px; flex: none;" v-model="searchDto.searchType">
                                <option value="이름">이름</option>
                                <option value="아이디">아이디</option>
                            </select>
                            <input type="text" class="form-control form-control-sm" v-model="searchDto.searchKeyword" @keyup.enter="fetchUsers" placeholder="검색어를 입력하세요">
                        </div>
                    </div>
                    <div class="filter-item">
                        <!-- Empty slot to maintain 50/50 alignment if needed, or just let it occupy half -->
                    </div>
                </div>

                <div class="filter-row">
                    <div class="filter-item" style="flex: 0 0 100%; max-width: 100%;">
                        <div class="filter-label">가입일</div>
                        <div class="filter-content flex-wrap">
                            <div class="radio-group me-3">
                                <label><input type="radio" v-model="dateType" value="all"> 전체</label>
                                <label><input type="radio" v-model="dateType" value="today"> 오늘</label>
                                <label><input type="radio" v-model="dateType" value="7days"> 7일</label>
                                <label><input type="radio" v-model="dateType" value="30days"> 30일</label>
                                <label><input type="radio" v-model="dateType" value="6months"> 6개월</label>
                            </div>
                            <div class="date-input-wrap">
                                <input type="date" class="date-input" v-model="searchDto.startDate">
                                <span class="mx-1">~</span>
                                <input type="date" class="date-input" v-model="searchDto.endDate">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="search-filter-actions">
                    <button class="btn btn-sm btn-reset d-flex align-items-center justify-content-center gap-1" @click="resetSearch">
                        <i class="bi bi-arrow-counterclockwise"></i>초기화
                    </button>
                    <button class="btn btn-sm btn-search d-flex align-items-center justify-content-center gap-1" @click="fetchUsers">
                        <i class="bi bi-search"></i>검색
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="text-muted fs-7">
                    검색결과 <span class="text-primary fw-bold">{{ totalCount }}</span>개
                </div>
                <button class="btn btn-sm btn-primary" @click="goRegister">
                    <i class="bi bi-pencil me-1"></i>등록
                </button>
            </div>

            <div class="data-table-wrapper">
                <b-table
                    class="admin-b-table"
                    :items="userList"
                    :fields="fields"
                    hover
                    @row-clicked="(item) => goDetail(item.userNo)"
                    show-empty
                    empty-text="결과가 없습니다."
                >
                    <!-- No (Index) -->
                    <template #cell(no)="data">
                        {{ totalCount - ((currentPage - 1) * pageSize) - data.index }}
                    </template>

                    <!-- 사용자ID (Custom alignment and style) -->
                    <template #cell(userId)="data">
                        <span class="text-dark">{{ data.value }}</span>
                    </template>

                    <!-- 지역 (Combined area info) -->
                    <template #cell(areaInfo)="data">
                        {{ data.item.areaNm || '' }} {{ data.item.areaSeNm || '' }}
                    </template>


                    <!-- 상태 (Badge) -->
                    <template #cell(userSttusNm)="data">
                        <span class="status-badge" :class="data.value === '활동' ? 'status-active' : ''">
                            {{ data.value }}
                        </span>
                    </template>

                    <!-- 등록자 (Empty check) -->
                    <template #cell(registerNm)="data">
                        {{ data.value || '' }}
                    </template>
                </b-table>
            </div>

            <!-- Pagination -->
            <div class="mt-4 d-flex justify-content-center">
                <b-pagination
                    v-model="currentPage"
                    :total-rows="totalCount"
                    :per-page="pageSize"
                    size="sm"
                    @update:model-value="handlePageChange"
                ></b-pagination>
            </div>
        </div>
    </div>

    <div id="admin-user-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted, computed, watch } = Vue;
            const app = createApp({
                setup() {
                    const userList = ref([]);
                    const authors = ref([]);
                    const statusCodes = ref([]);
                    const totalCount = ref(0);
                    const currentPage = ref(1);
                    const pageSize = 10;
                    
                    const searchDto = ref({
                        searchStatus: '전체',
                        searchAuthor: '전체',
                        searchType: '이름',
                        searchKeyword: '',
                        startDate: '',
                        endDate: ''
                    });

                    const dateType = ref('all');

                    const fetchAuthors = () => {
                        axios.get('/api/admin/user/authors')
                            .then(res => authors.value = res.data);
                    };

                    const fetchStatusCodes = async () => {
                        statusCodes.value = await AdminCode.getCodes('R010050');
                    };

                    const fetchUsers = () => {
                        axios.get('/api/admin/user/list', {
                            params: { ...searchDto.value, page: currentPage.value, size: pageSize }
                        }).then(res => {
                            userList.value = res.data.list;
                            totalCount.value = res.data.totalCount;
                        }).catch(err => {
                            console.error('Fetch users error:', err);
                        });
                    };

                    const resetSearch = () => {
                        searchDto.value = {
                            searchStatus: '전체',
                            searchAuthor: '전체',
                            searchType: '이름',
                            searchKeyword: '',
                            startDate: '',
                            endDate: ''
                        };
                        dateType.value = 'all';
                        currentPage.value = 1;
                        fetchUsers();
                    };


                    const handlePageChange = (p) => {
                        currentPage.value = p;
                        fetchUsers();
                    };

                    const goRegister = () => {
                        window.location.href = '/admin/user/insertFormUserMgt.do';
                    };

                    const goDetail = (no) => {
                        window.location.href = `/admin/user/selectUserMgt.do?userNo=${no}`;
                    };

                    watch(dateType, (val) => {
                        const now = new Date();
                        let start = new Date();
                        const format = (d) => d.toISOString().split('T')[0];
                        
                        searchDto.value.endDate = format(now);
                        
                        switch(val) {
                            case 'today':
                                searchDto.value.startDate = format(now);
                                break;
                            case '7days':
                                start.setDate(now.getDate() - 7);
                                searchDto.value.startDate = format(start);
                                break;
                            case '30days':
                                start.setDate(now.getDate() - 30);
                                searchDto.value.startDate = format(start);
                                break;
                            case '6months':
                                start.setMonth(now.getMonth() - 6);
                                searchDto.value.startDate = format(start);
                                break;
                            default:
                                searchDto.value.startDate = '';
                                searchDto.value.endDate = '';
                        }
                    });

                    onMounted(() => {
                        AdminMenu.init();
                        fetchAuthors();
                        fetchStatusCodes();
                        fetchUsers();
                    });

                    const fields = [
                        { key: 'no', label: 'No', thStyle: { width: '80px' } },
                        { key: 'userNo', label: '사용자No', thStyle: { width: '120px' } },
                        { key: 'userId', label: '사용자ID', tdClass: 'text-start px-3' },
                        { key: 'authorNm', label: '권한명', thStyle: { width: '200px' } },
                        { key: 'areaInfo', label: '지역', thStyle: { width: '150px' } },
                        { key: 'registDtStr', label: '가입일자', thStyle: { width: '120px' } },
                        { key: 'userSttusNm', label: '상태', thStyle: { width: '120px' } },
                        { key: 'registerNm', label: '등록자', thStyle: { width: '150px' } }
                    ];

                    return { 
                        userList, authors, statusCodes, totalCount, currentPage, pageSize, fields,
                        searchDto, dateType, fetchUsers, resetSearch, 
                        handlePageChange, goDetail, goRegister 
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
