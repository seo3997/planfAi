<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-authmenu-content}, ~{::#admin-authmenu-script}, ~{::#admin-authmenu-head})}">
<head>
    <title>권한별 메뉴관리 - PlanfAi 관리자</title>
    <th:block id="admin-authmenu-head">
    </th:block>
</head>
<body>
    <div id="admin-authmenu-content">
        <div class="page-title-box">
            <h2 class="page-title">권한별 메뉴관리</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door"></i> > 시스템 > <span class="text-dark fw-medium">권한별 메뉴관리</span>
            </div>
        </div>

        <b-card class="mgmt-card shadow-sm border-0">
            <template #header>
                <h3 class="section-title mb-0">권한 목록</h3>
            </template>
            <!-- 검색 영역 -->
            <table class="search-table mb-4">
                <tr>
                    <th>권한명 검색</th>
                    <td>
                        <input type="text" class="form-control form-control-sm" style="width: 400px;" v-model="schAuthNm" placeholder="권한명을 입력하세요" @keyup.enter="fetchAuthors">
                    </td>
                </tr>
                <tr class="search-actions-row">
                    <td colspan="2">
                        <div class="d-flex justify-content-end p-2 gap-2">
                            <b-button variant="outline-secondary" size="sm" @click="resetSearch"><i class="bi bi-arrow-counterclockwise me-1"></i>초기화</b-button>
                            <b-button variant="primary" size="sm" @click="fetchAuthors"><i class="bi bi-search me-1"></i>검색</b-button>
                        </div>
                    </td>
                </tr>
            </table>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">No</th>
                            <th>권한명</th>
                            <th style="width: 200px;">등록자</th>
                            <th style="width: 200px;">등록일</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(author, index) in authorList" :key="author.AUTHOR_ID" class="cursor-pointer" @click="goToMapping(author.AUTHOR_ID)">
                            <td>{{ totCnt - index }}</td>
                            <td class="text-start px-4">{{ author.AUTHOR_NM }}</td>
                            <td>{{ author.USER_NM }}</td>
                            <td>{{ author.REGIST_YMD }}</td>
                        </tr>
                        <tr v-if="authorList.length === 0">
                            <td colspan="4" class="text-center py-5 text-muted">조회된 권한이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </b-card>
    </div>

    <div id="admin-authmenu-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const authorList = ref([]);
                    const totCnt = ref(0);
                    const schAuthNm = ref('');

                    const fetchAuthors = () => {
                        axios.get('/api/admin/authmenu/authors', { params: { schAuthNm: schAuthNm.value } })
                            .then(res => {
                                authorList.value = res.data.list;
                                totCnt.value = res.data.totCnt;
                            })
                            .catch(() => alert('조회 실패'));
                    };

                    const goToMapping = (authorId) => {
                        location.href = `/admin/authmenu/selectListAuthMenuMgt.do?authorId=${authorId}`;
                    };

                    const resetSearch = () => {
                        schAuthNm.value = '';
                        fetchAuthors();
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchAuthors();
                    });

                    return { authorList, totCnt, schAuthNm, fetchAuthors, goToMapping, resetSearch };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
