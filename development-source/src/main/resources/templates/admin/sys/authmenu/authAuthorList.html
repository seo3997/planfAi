<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-authmenu-content}, ~{::#admin-authmenu-script}, ~{::#admin-authmenu-head})}">
<head>
    <title>권한별 메뉴관리 - PlanfAi 관리자</title>
    <th:block id="admin-authmenu-head">
    </th:block>
</head>
<body>
    <div id="admin-authmenu-content">
        <div class="page-title-box">
            <h2 class="page-title">권한별 메뉴관리</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door"></i> > 시스템 > <span class="text-dark fw-medium">권한별 메뉴관리</span>
            </div>
        </div>

        <div class="mgmt-card">
            <!-- 검색 영역 -->
            <!-- Search Area (Refactored to Div-based) -->
            <div class="search-filter-box">
                <div class="filter-row">
                    <div class="filter-item" style="flex: 0 0 100%; max-width: 100%;">
                        <div class="filter-label">권한명 검색</div>
                        <div class="filter-content">
                            <input type="text" class="form-control form-control-sm" v-model="schAuthNm" placeholder="권한명을 입력하세요" @keyup.enter="fetchAuthors">
                        </div>
                    </div>
                </div>
                
                <div class="search-filter-actions">
                    <button class="btn btn-sm btn-reset d-flex align-items-center justify-content-center gap-1" @click="resetSearch">
                        <i class="bi bi-arrow-counterclockwise"></i> 초기화
                    </button>
                    <button class="btn btn-sm btn-search d-flex align-items-center justify-content-center gap-1" @click="fetchAuthors">
                        <i class="bi bi-search"></i> 검색
                    </button>
                </div>
            </div>

            <div class="data-table-wrapper">
                <b-table
                    class="admin-b-table"
                    :items="authorList"
                    :fields="fields"
                    hover
                    @row-clicked="(item) => goToMapping(item.AUTHOR_ID)"
                    show-empty
                    empty-text="조회된 권한이 없습니다."
                >
                    <!-- No (Index) -->
                    <template #cell(no)="data">
                        {{ totCnt - data.index }}
                    </template>
                </b-table>
            </div>
        </div>
    </div>

    <div id="admin-authmenu-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const authorList = ref([]);
                    const totCnt = ref(0);
                    const schAuthNm = ref('');

                    const fetchAuthors = () => {
                        axios.get('/api/admin/authmenu/authors', { params: { schAuthNm: schAuthNm.value } })
                            .then(res => {
                                authorList.value = res.data.list;
                                totCnt.value = res.data.totCnt;
                            })
                            .catch(() => alert('조회 실패'));
                    };

                    const goToMapping = (authorId) => {
                        location.href = `/admin/authmenu/selectListAuthMenuMgt.do?authorId=${authorId}`;
                    };

                    const resetSearch = () => {
                        schAuthNm.value = '';
                        fetchAuthors();
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchAuthors();
                    });

                    const fields = [
                        { key: 'no', label: 'No', thStyle: { width: '80px' } },
                        { key: 'AUTHOR_NM', label: '권한명', tdClass: 'text-start px-4' },
                        { key: 'USER_NM', label: '등록자', thStyle: { width: '200px' } },
                        { key: 'REGIST_YMD', label: '등록일', thStyle: { width: '200px' } }
                    ];

                    return { authorList, totCnt, schAuthNm, fields, fetchAuthors, goToMapping, resetSearch };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
