<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-menu-content}, ~{::#admin-menu-script}, ~{::#admin-menu-head})}">
<head>
    <title>메뉴 관리 - PlanfAi 관리자</title>
    <th:block id="admin-menu-head">
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vuedraggable@4.1.0/dist/vuedraggable.umd.min.js"></script>
    </th:block>
</head>
<body>
    <div id="admin-menu-content">
        <div class="page-title-box">
            <h2 class="page-title">메뉴관리</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door"></i> > 시스템 > <span class="text-dark fw-medium">메뉴관리</span>
            </div>
        </div>

        <div class="menu-mgmt-container">
            <!-- Left: Menu Tree -->
            <div class="tree-section">
                <div class="tree-header d-flex gap-2 mb-3">
                    <button class="btn-tree-ctrl" @click="toggleAll(false)"><i class="bi bi-folder me-1"></i>접기</button>
                    <button class="btn-tree-ctrl" @click="toggleAll(true)"><i class="bi bi-folder2-open me-1"></i>펼치기</button>
                </div>
                <ul class="tree-list">
                    <tree-item 
                        v-for="node in menuTree" 
                        :key="node.menuId" 
                        :node="node" 
                        :selected-id="selectedId" 
                        :expanded-ids="expandedIds"
                        @select="selectMenu"
                        @toggle="toggleNode"
                        @reorder="saveAllOrders">
                    </tree-item>
                </ul>
            </div>

            <!-- Right: Management Forms -->
            <div class="form-section form-section-card">
                <!-- Top: Edit Form -->
                <div v-if="selectedId">
                    <table class="form-table">
                        <tr>
                            <th class="required">상위메뉴 ID</th>
                            <td><input type="text" v-model="editForm.parentMenuId" class="form-control" readonly></td>
                            <th class="required">상위메뉴명</th>
                            <td><input type="text" v-model="editForm.parentMenuNm" class="form-control" readonly></td>
                        </tr>
                        <tr>
                            <th class="required">메뉴 ID</th>
                            <td><input type="text" v-model="editForm.menuId" class="form-control" readonly></td>
                            <th class="required">메뉴레벨</th>
                            <td><input type="text" v-model="editForm.menuLevel" class="form-control" readonly></td>
                        </tr>
                        <tr>
                            <th class="required">메뉴명</th>
                            <td colspan="3"><input type="text" v-model="editForm.menuNm" class="form-control"></td>
                        </tr>
                        <tr>
                            <th class="required">메뉴유형</th>
                            <td>
                                <select v-model="editForm.menuTyCode" class="form-select">
                                    <option value="10">카테고리</option>
                                    <option value="20">메뉴</option>
                                    <option value="30">기능</option>
                                </select>
                            </td>
                            <th class="required">정렬순서</th>
                            <td><input type="number" v-model="editForm.sortOrdr" class="form-control"></td>
                        </tr>
                        <tr>
                            <th>전시여부</th>
                            <td colspan="3">
                                <select v-model="editForm.useYn" class="form-select">
                                    <option value="Y">예</option>
                                    <option value="N">아니오</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th>URL</th>
                            <td colspan="3"><input type="text" v-model="editForm.url" class="form-control"></td>
                        </tr>
                    </table>
                    <div class="btn-action-group">
                        <button class="btn-update-major" @click="saveEdit"><i class="bi bi-pencil-square me-1"></i>수정</button>
                        <button class="btn-delete-major" @click="deleteMenu(selectedId)"><i class="bi bi-trash me-1"></i>삭제</button>
                        <button class="btn-new-major" @click="showNewForm"><i class="bi bi-plus-lg me-1"></i>신규등록</button>
                    </div>
                </div>
                <div v-else class="text-center py-5 text-muted">
                    좌측 트리에서 메뉴를 선택해주세요.
                </div>

                <div v-if="isNewFormVisible" class="mt-4 pt-4 border-top">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                        <div class="cardTitle" style="font-size: 16px;">
                            <i class="bi bi-plus-square-fill color-blue me-2"></i>신규 메뉴 추가
                        </div>
                        <button class="btn btn-sm btn-outline-primary" @click="addNewMenuForm">
                            <i class="bi bi-plus-lg me-1"></i>항목 추가
                        </button>
                    </div>

                    <div v-for="(form, index) in newMenus" :key="index" class="mb-5 p-3 position-relative" style="background: #fcfcfc; border: 1px dashed #ddd; border-radius: 8px;">
                        <button v-if="newMenus.length > 1" class="btn btn-sm btn-danger position-absolute" style="top: 10px; right: 10px;" @click="removeMenuForm(index)">삭제</button>
                        
                        <table class="form-table">
                            <tr>
                                <th class="required">상위메뉴 ID</th>
                                <td colspan="3">
                                    <div class="d-flex gap-2 align-items-center">
                                        <input type="text" v-model="form.parentMenuId" class="form-control" readonly style="width: 250px; background-color: #f1f1f1;">
                                        <input type="text" v-model="form.subMenuId" class="form-control" placeholder="메뉴ID 4자리" maxlength="4" style="width: 150px;" @input="form.isIdChecked = false">
                                        <button class="btn-dup-check" :class="{ 'is-checked': form.isIdChecked }" @click="checkIdDuplicate(index)">
                                            {{ form.isIdChecked ? '확인완료' : '중복확인' }}
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th class="required">메뉴명</th>
                                <td colspan="3"><input type="text" v-model="form.menuNm" class="form-control"></td>
                            </tr>
                            <tr>
                                <th class="required">메뉴유형</th>
                                <td>
                                    <select v-model="form.menuTyCode" class="form-select">
                                        <option value="">선택하세요</option>
                                        <option value="10">카테고리</option>
                                        <option value="20">메뉴</option>
                                        <option value="30">기능</option>
                                    </select>
                                </td>
                                <th class="required">정렬순서</th>
                                <td><input type="number" v-model="form.sortOrdr" class="form-control"></td>
                            </tr>
                            <tr>
                                <th>전시여부</th>
                                <td colspan="3">
                                    <select v-model="form.useYn" class="form-select">
                                        <option value="Y">예</option>
                                        <option value="N">아니오</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <th>URL</th>
                                <td colspan="3"><input type="text" v-model="form.url" class="form-control"></td>
                            </tr>
                        </table>
                    </div>

                    <div class="d-flex justify-content-center gap-2 mt-4 pb-5">
                        <button class="btn btn-secondary" @click="isNewFormVisible = false">취소</button>
                        <button class="btn btn-primary px-5" @click="registerMenus">등록</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-menu-script">
        <script>
            const TreeItem = {
                name: 'TreeItem',
                props: ['node', 'selectedId', 'expandedIds'],
                emits: ['select', 'toggle', 'reorder'],
                components: {
                    draggable: window.vuedraggable
                },
                template: `
                    <li class="tree-node">
                        <div class="tree-row" 
                             :class="{ selected: selectedId === node.menuId }" 
                             @click="$emit('select', node)">
                            <span class="tree-toggle" @click.stop="$emit('toggle', node)">
                                <template v-if="node.children && node.children.length > 0">
                                    <i :class="expandedIds.has(node.menuId) ? 'bi bi-dash-square' : 'bi bi-plus-square'"></i>
                                </template>
                            </span>
                            <span class="tree-text">{{ node.menuNm }}</span>
                        </div>
                        
                        <draggable 
                            v-if="node.children && node.children.length > 0 && expandedIds.has(node.menuId)"
                            v-model="node.children"
                            tag="ul"
                            class="tree-list"
                            item-key="menuId"
                            ghost-class="ghost"
                            handle=".tree-label"
                            @end="$emit('reorder')"
                        >
                            <template #item="{element}">
                               <tree-item 
                                    :node="element" 
                                    :selected-id="selectedId" 
                                    :expanded-ids="expandedIds"
                                    @select="$emit('select', $event)"
                                    @toggle="$emit('toggle', $event)"
                                    @reorder="$emit('reorder')">
                                </tree-item>
                            </template>
                        </draggable>
                    </li>
                `
            };
        </script>
        <script>
            const initVueApp = true;
            const { createApp, ref, reactive, onMounted, computed, watch } = Vue;

            const app = createApp({
                components: { 
                    TreeItem,
                    draggable: window.vuedraggable
                },
                setup() {
                    const flatMenus = ref([]);
                    const menuTree = ref([]);
                    const selectedId = ref('');
                    const expandedIds = ref(new Set());
                    const isNewFormVisible = ref(false);
                    const editForm = reactive({
                        parentMenuId: '', parentMenuNm: '', menuId: '', menuLevel: '',
                        menuNm: '', menuTyCode: '20', sortOrdr: 1, useYn: 'Y', url: ''
                    });

                    const newMenus = ref([]);

                    const buildTree = (data) => {
                        const list = JSON.parse(JSON.stringify(data));
                        const map = {};
                        const roots = [];

                        list.forEach(m => {
                            m.children = [];
                            map[m.menuId] = m;
                        });

                        list.forEach(m => {
                            const pid = m.menuId.length > 4 ? m.menuId.substring(0, m.menuId.length - 4) : '';
                            if (pid && map[pid]) {
                                map[pid].children.push(m);
                            } else {
                                roots.push(m);
                            }
                        });
                        return roots;
                    };

                    const fetchMenus = () => {
                        axios.get('/api/admin/menu')
                            .then(res => {
                                flatMenus.value = res.data;
                                menuTree.value = buildTree(res.data);
                                toggleAll(true);
                            })
                            .catch(err => alert('메뉴 조회 실패'));
                    };

                    const selectMenu = (node) => {
                        selectedId.value = node.menuId;
                        isNewFormVisible.value = false;
                        
                        const pid = node.menuId.length > 4 ? node.menuId.substring(0, node.menuId.length - 4) : '';
                        const parent = flatMenus.value.find(m => m.menuId === pid);
                        
                        editForm.parentMenuId = pid || 'NONE';
                        editForm.parentMenuNm = parent ? parent.menuNm : '최상위';
                        editForm.menuId = node.menuId;
                        editForm.menuLevel = node.menuLevel;
                        editForm.menuNm = node.menuNm;
                        editForm.menuTyCode = node.menuTyCode;
                        editForm.sortOrdr = node.sortOrdr;
                        editForm.useYn = node.useYn;
                        editForm.url = node.url;
                    };

                    const toggleNode = (node) => {
                        if (expandedIds.value.has(node.menuId)) {
                            expandedIds.value.delete(node.menuId);
                        } else {
                            expandedIds.value.add(node.menuId);
                        }
                    };

                    const toggleAll = (expand) => {
                        if (expand) {
                            flatMenus.value.forEach(m => expandedIds.value.add(m.menuId));
                        } else {
                            expandedIds.value.clear();
                        }
                    };

                    const showNewForm = () => {
                        isNewFormVisible.value = true;
                        newMenus.value = [];
                        addNewMenuForm();
                    };

                    const addNewMenuForm = () => {
                        newMenus.value.push({
                            parentMenuId: selectedId.value || '',
                            subMenuId: '',
                            menuNm: '',
                            menuTyCode: '20',
                            sortOrdr: (newMenus.value.length + 1) * 10,
                            useYn: 'Y',
                            url: '',
                            isIdChecked: false
                        });
                        setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 50);
                    };

                    const removeMenuForm = (index) => {
                        if (newMenus.value.length > 1) {
                            newMenus.value.splice(index, 1);
                        }
                    };

                    const checkIdDuplicate = (index) => {
                        const form = newMenus.value[index];
                        if (!/^\d{4}$/.test(form.subMenuId)) {
                            return alert('메뉴 ID는 숫자 4자리여야 합니다.');
                        }
                        
                        const fullId = form.parentMenuId + form.subMenuId;
                        if (flatMenus.value.some(m => m.menuId === fullId)) {
                            form.isIdChecked = false;
                            alert('이미 존재하는 메뉴 ID입니다.');
                        } else {
                            form.isIdChecked = true;
                            alert('사용 가능한 ID입니다.');
                        }
                    };

                    const saveEdit = () => {
                        if (!editForm.menuNm.trim()) return alert('메뉴명을 입력해주세요.');
                        
                        axios.post('/api/admin/menu', {
                            menuId: editForm.menuId,
                            parentMenuId: editForm.parentMenuId === 'NONE' ? '' : editForm.parentMenuId,
                            subMenuId: editForm.menuId.substring(editForm.menuId.length - 4),
                            menuNm: editForm.menuNm,
                            menuTyCode: editForm.menuTyCode,
                            sortOrdr: editForm.sortOrdr,
                            useYn: editForm.useYn,
                            url: editForm.url
                        })
                        .then(() => {
                            alert('저장되었습니다.');
                            fetchMenus();
                        })
                        .catch(err => AdminUtil.handleApiError(err));
                    };

                    const registerMenus = async () => {
                        for (let i = 0; i < newMenus.value.length; i++) {
                            const form = newMenus.value[i];
                            if (!form.isIdChecked) return alert(`[${i+1}번째 항목] 먼저 중복확인을 해주세요.`);
                            if (!form.menuNm.trim()) return alert(`[${i+1}번째 항목] 메뉴명을 입력해주세요.`);
                            if (!form.menuTyCode) return alert(`[${i+1}번째 항목] 메뉴유형을 선택해주세요.`);
                        }
                        
                        try {
                            const promises = newMenus.value.map(form => {
                                return axios.post('/api/admin/menu', {
                                    parentMenuId: form.parentMenuId,
                                    subMenuId: form.subMenuId,
                                    menuNm: form.menuNm,
                                    menuTyCode: form.menuTyCode,
                                    sortOrdr: form.sortOrdr,
                                    useYn: form.useYn,
                                    url: form.url
                                });
                            });
                            
                            await Promise.all(promises);
                            alert('모든 메뉴가 등록되었습니다.');
                            isNewFormVisible.value = false;
                            fetchMenus();
                        } catch(err) {
                            AdminUtil.handleApiError(err);
                        }
                    };

                    const deleteMenu = (id) => {
                        if (confirm('해당 메뉴와 하위 메뉴가 모두 삭제됩니다. 계속하시겠습니까?')) {
                            axios.delete(`/api/admin/menu/${id}`)
                                .then(() => {
                                    alert('삭제되었습니다.');
                                    selectedId.value = '';
                                    fetchMenus();
                                })
                                .catch(err => AdminUtil.handleApiError(err));
                        }
                    };

                    const saveAllOrders = () => {
                        selectedId.value = '';
                        isNewFormVisible.value = false;
                        
                        const updateList = [];
                        const traverse = (nodes, parentSorts = [0,0,0,0,0,0]) => {
                            nodes.forEach((node, index) => {
                                const newSort = (index + 1) * 10;
                                node.sortOrdr = newSort;
                                
                                const currentSorts = [...parentSorts];
                                const lvl = node.menuLevel;
                                currentSorts[lvl - 1] = newSort;
                                
                                node.sortOrdr1 = currentSorts[0];
                                node.sortOrdr2 = currentSorts[1];
                                node.sortOrdr3 = currentSorts[2];
                                node.sortOrdr4 = currentSorts[3];
                                node.sortOrdr5 = currentSorts[4];
                                node.sortOrdr6 = currentSorts[5];
                                
                                updateList.push({
                                    menuId: node.menuId,
                                    menuLevel: node.menuLevel,
                                    sortOrdr: node.sortOrdr,
                                    sortOrdr1: node.sortOrdr1,
                                    sortOrdr2: node.sortOrdr2,
                                    sortOrdr3: node.sortOrdr3,
                                    sortOrdr4: node.sortOrdr4,
                                    sortOrdr5: node.sortOrdr5,
                                    sortOrdr6: node.sortOrdr6
                                });
                                
                                if (node.children && node.children.length > 0) {
                                    traverse(node.children, currentSorts);
                                }
                            });
                        };

                        traverse(menuTree.value);

                        axios.post('/api/admin/menu/order', updateList)
                            .then(() => {
                                sessionStorage.removeItem('topMenus');
                                Object.keys(sessionStorage).forEach(key => {
                                    if (key.startsWith('leftMenus_')) {
                                        sessionStorage.removeItem(key);
                                    }
                                });
                                fetchMenus();
                            })
                            .catch(err => AdminUtil.handleApiError(err));
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchMenus();
                    });

                    return { 
                        flatMenus, menuTree, selectedId, expandedIds, editForm, newMenus, isNewFormVisible,
                        selectMenu, toggleNode, toggleAll, showNewForm, addNewMenuForm, removeMenuForm, checkIdDuplicate, saveEdit, registerMenus, deleteMenu, saveAllOrders
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
