<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-code-content}, ~{::#admin-code-script}, ~{::#admin-code-head})}">
<head>
    <title>코드 관리 - PlanfAi 관리자</title>
    <th:block id="admin-code-head">
    </th:block>
</head>
<body>
    <div id="admin-code-content">
        <div class="page-title-box">
            <h2 class="page-title">코드관리</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 시스템 > <span class="text-primary fw-medium">코드관리</span>
            </div>
        </div>

        <div class="mgmt-card">
            <!-- 검색 영역 -->
            <!-- Search Area (Refactored to Div-based) -->
            <div class="search-filter-box">
                <div class="filter-row">
                    <div class="filter-item" style="flex: 0 0 100%; max-width: 100%;">
                        <div class="filter-label">그룹명 검색</div>
                        <div class="filter-content">
                            <input type="text" class="form-control form-control-sm" v-model="schGroupNm" placeholder="그룹코드명 또는 그룹코드를 입력하세요" @keyup.enter="fetchGroups">
                        </div>
                    </div>
                </div>
                
                <div class="search-filter-actions">
                    <button class="btn btn-sm btn-reset d-flex align-items-center justify-content-center gap-1" @click="resetSearch">
                        <i class="bi bi-arrow-counterclockwise"></i> 초기화
                    </button>
                    <button class="btn btn-sm btn-search d-flex align-items-center justify-content-center gap-1" @click="fetchGroups">
                        <i class="bi bi-search"></i> 검색
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="text-muted fs-7">
                    검색결과 <span class="text-primary fw-bold">{{ totCnt }}</span>개
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-danger" @click="deleteSelected"><i class="bi bi-trash"></i> 삭제</button>
                    <button class="btn btn-sm btn-primary" @click="goRegister"><i class="bi bi-pencil"></i> 등록</button>
                </div>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;"><input type="checkbox" v-model="allSelected" @change="selectAll"></th>
                            <th style="width: 60px;">No</th>
                            <th style="width: 15%;">그룹코드</th>
                            <th>그룹코드명</th>
                            <th>영문그룹코드명</th>
                            <th style="width: 120px;">등록자</th>
                            <th style="width: 120px;">등록일</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(item, index) in groupList" :key="item.groupId" @click="goDetail(item.groupId)" style="cursor: pointer;">
                            <td @click.stop><input type="checkbox" v-model="selectedIds" :value="item.groupId"></td>
                            <td>{{ totCnt - ((page - 1) * size) - index }}</td>
                            <td class="fw-medium text-dark">{{ item.groupId }}</td>
                            <td class="text-start px-3 text-dark">{{ item.groupNm }}</td>
                            <td class="text-start px-3 text-muted">{{ item.groupNmEng }}</td>
                            <td>{{ item.registerNm }}</td>
                            <td>{{ item.registYmd }}</td>
                        </tr>
                        <tr v-if="groupList.length === 0">
                            <td colspan="7" class="text-center py-5 text-muted">검색 결과가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 페이징 컴포넌트 -->
            <div class="mt-4 d-flex justify-content-center">
                <b-pagination
                    v-model="page"
                    :total-rows="totCnt"
                    :per-page="size"
                    size="sm"
                    @update:model-value="handlePageChange"
                ></b-pagination>
            </div>
        </div>
    </div>

    <div id="admin-code-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted, computed } = Vue;
            const app = createApp({
                setup() {
                    const groupList = ref([]);
                    const totCnt = ref(0);
                    const page = ref(1);
                    const size = 10;
                    const schGroupNm = ref('');
                    const selectedIds = ref([]);
                    const allSelected = ref(false);

                    const fetchGroups = () => {
                        axios.get('/api/admin/code/groups', {
                            params: { schGroupNm: schGroupNm.value, page: page.value, size: size }
                        }).then(res => {
                            groupList.value = res.data.list;
                            totCnt.value = res.data.totCnt;
                        }).catch(err => {
                            console.error('Fetch error:', err);
                            alert('조회 중 오류가 발생했습니다.');
                        });
                    };

                    const resetSearch = () => {
                        schGroupNm.value = '';
                        page.value = 1;
                        fetchGroups();
                    };

                    const handlePageChange = (p) => {
                        page.value = p;
                        fetchGroups();
                    };

                    const selectAll = () => {
                        if (allSelected.value) {
                            selectedIds.value = groupList.value.map(i => i.groupId);
                        } else {
                            selectedIds.value = [];
                        }
                    };

                    const goRegister = () => location.href = '/admin/code/insertFormGroupCodeMgt.do';
                    const goDetail = (id) => location.href = `/admin/code/selectListCodeMgt.do?groupId=${id}`;

                    const deleteSelected = async () => {
                        if (selectedIds.value.length === 0) {
                            alert('삭제할 항목을 선택해주세요.');
                            return;
                        }
                        if (confirm('선택한 항목을 삭제하시겠습니까? 관련 세부 코드도 모두 삭제됩니다.')) {
                            try {
                                for (const id of selectedIds.value) {
                                    await axios.delete(`/api/admin/code/groups/${id}`);
                                }
                                alert('삭제되었습니다.');
                                fetchGroups();
                            } catch (err) {
                                alert('삭제 중 오류 발생');
                            }
                        }
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchGroups();
                    });

                    return { 
                        groupList, totCnt, page, size, schGroupNm, selectedIds, allSelected, 
                        fetchGroups, resetSearch, handlePageChange, selectAll, goRegister, goDetail, deleteSelected 
                    };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
