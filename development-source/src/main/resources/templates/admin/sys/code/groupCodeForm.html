<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-code-content}, ~{::#admin-code-script}, ~{::#admin-code-head})}">
<head>
    <title>그룹코드 등록 - PlanfAi 관리자</title>
    <th:block id="admin-code-head">
    </th:block>
</head>
<body>
    <div id="admin-code-content">
        <div class="page-title-box">
            <h2 class="page-title">그룹코드 등록</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door text-muted"></i> > 시스템 > <span class="text-primary fw-medium">코드관리</span>
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">
                <i class="bi bi-caret-right-fill text-primary"></i> 그룹코드 정보
            </div>
            <table class="form-table">
                <tr>
                    <th>그룹코드</th>
                    <td><input type="text" v-model="form.groupId" class="form-control" placeholder="그룹코드를 입력하세요"></td>
                </tr>
                <tr>
                    <th>그룹코드명</th>
                    <td><input type="text" v-model="form.groupNm" class="form-control" placeholder="그룹코드명을 입력하세요"></td>
                </tr>
                <tr>
                    <th>영문그룹코드명</th>
                    <td><input type="text" v-model="form.groupNmEng" class="form-control" placeholder="영문그룹코드명을 입력하세요"></td>
                </tr>
                <tr>
                    <th>비고</th>
                    <td><textarea v-model="form.rm" class="form-control" rows="3" placeholder="기타 참고사항을 입력하세요"></textarea></td>
                </tr>
            </table>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4">
            <button class="btn-list" @click="goBack"><i class="bi bi-list"></i> 목록</button>
            <button class="btn-submit" @click="saveGroup"><i class="bi bi-check-lg"></i> 저장</button>
        </div>
    </div>

    <div id="admin-code-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const form = ref({ groupId: '', groupNm: '', groupNmEng: '', rm: '' });

                    const saveGroup = () => {
                        if (!form.value.groupId || !form.value.groupNm) {
                            alert('코드와 명칭을 입력해주세요.');
                            return;
                        }
                        axios.post('/api/admin/code/groups', form.value)
                            .then(res => {
                                alert(res.data);
                                location.href = '/admin/code/selectPageListGroupCodeMgt.do';
                            })
                            .catch(err => alert('등록 실패: ' + (err.response?.data || '')));
                    };

                    const goBack = () => location.href = '/admin/code/selectPageListGroupCodeMgt.do';

                    onMounted(() => {
                        AdminMenu.init();
                    });

                    return { form, saveGroup, goBack };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
