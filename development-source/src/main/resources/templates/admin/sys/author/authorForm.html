<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-author-form-content}, ~{::#admin-author-form-script}, ~{::#admin-author-form-head})}">
<head>
    <title>권한 관리 - PlanfAi 관리자</title>
    <th:block id="admin-author-form-head">
        <style>
            .form-table {
                border-top: 2px solid #3b5998;
                border-collapse: collapse;
            }
            .form-table th {
                background-color: #f8f9fa;
                width: 180px;
                padding: 15px;
                vertical-align: middle;
                border: 1px solid #dee2e6;
                font-weight: 500;
                color: #333;
            }
            .form-table td {
                padding: 10px 15px;
                border: 1px solid #dee2e6;
                background-color: #fff;
            }
            .btn-teal {
                background-color: #1abc9c !important;
                border-color: #1abc9c !important;
                color: white !important;
            }
            .btn-teal:hover {
                background-color: #16a085 !important;
                border-color: #16a085 !important;
            }
            .btn-orange {
                background-color: #e67e22 !important;
                border-color: #e67e22 !important;
                color: white !important;
            }
            .btn-orange:hover {
                background-color: #d35400 !important;
                border-color: #d35400 !important;
            }
            .readonly-input {
                background-color: #eeeeee !important;
                cursor: not-allowed;
            }
        </style>
    </th:block>
</head>
<body>
    <div id="admin-author-form-content">
        <div class="page-title-box">
            <h2 class="page-title">{{ isEdit ? '권한수정' : '권한등록' }}</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door"></i> > <span class="text-dark fw-medium">권한관리</span>
            </div>
        </div>

        <b-card class="mgmt-card shadow-sm border-0 mt-3">
            <table class="form-table w-100 mb-4">
                <tr>
                    <th class="required">권한ID</th>
                    <td>
                        <b-form-input v-model="form.authorId" :readonly="isEdit" :class="{ 'readonly-input': isEdit }" placeholder="예: ROLE_ADMIN"></b-form-input>
                    </td>
                </tr>
                <tr>
                    <th class="required">권한명</th>
                    <td>
                        <b-form-input v-model="form.authorNm" required placeholder="권한명을 입력하세요"></b-form-input>
                    </td>
                </tr>
                <tr>
                    <th>내용</th>
                    <td>
                        <b-form-textarea v-model="form.rm" rows="5" placeholder="권한에 대한 설명을 입력하세요"></b-form-textarea>
                    </td>
                </tr>
            </table>

            <div class="d-flex justify-content-center gap-2 mt-4">
                <b-button href="/admin/author/selectPageListAuthorMgt.do" variant="outline-secondary" class="px-4">
                    <i class="bi bi-list me-1"></i>목록
                </b-button>
                <b-button @click="saveAuthor" variant="primary" class="px-4 btn-teal">
                    <i :class="isEdit ? 'bi bi-pencil' : 'bi bi-check-lg'" class="me-1"></i>
                    {{ isEdit ? '수정' : '저장' }}
                </b-button>
                <b-button @click="deleteAuthor" variant="danger" class="px-4 btn-orange" v-if="isEdit">
                    <i class="bi bi-trash me-1"></i>삭제
                </b-button>
            </div>
        </b-card>
    </div>

    <div id="admin-author-form-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const form = ref({ authorId: '', authorNm: '', rm: '' });
                    const isEdit = ref(false);

                    const fetchAuthorDetail = (authorId) => {
                        axios.get(`/api/admin/author/${authorId}`)
                            .then(res => {
                                form.value = res.data;
                            })
                            .catch(err => alert('권한 정보 조회 실패'));
                    };

                    const saveAuthor = () => {
                        if (!form.value.authorId) return alert('권한 ID를 입력하세요.');
                        if (!form.value.authorNm) return alert('권한명을 입력하세요.');

                        const action = isEdit.value ? axios.put : axios.post;
                        action('/api/admin/author', form.value)
                            .then(res => {
                                alert(res.data);
                                location.href = '/admin/author/selectPageListAuthorMgt.do';
                            })
                            .catch(err => AdminUtil.handleApiError(err, '저장 실패'));
                    };

                    const deleteAuthor = () => {
                        if (confirm('삭제하시겠습니까?')) {
                            axios.delete(`/api/admin/author/${form.value.authorId}`)
                                .then(res => {
                                    alert(res.data);
                                    location.href = '/admin/author/selectPageListAuthorMgt.do';
                                })
                                .catch(err => alert('삭제 실패'));
                        }
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        const urlParams = new URLSearchParams(window.location.search);
                        const authorId = urlParams.get('authorId');
                        if (authorId) {
                            isEdit.value = true;
                            fetchAuthorDetail(authorId);
                        }
                    });

                    return { form, isEdit, saveAuthor, deleteAuthor };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
