<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-author-content}, ~{::#admin-author-script}, ~{::#admin-author-head})}">
<head>
    <title>권한 관리 - PlanfAi 관리자</title>
    <th:block id="admin-author-head">
    </th:block>
</head>
<body>
    <div id="admin-author-content">
        <div class="page-title-box">
            <h2 class="page-title">권한관리</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door"></i> > 시스템 > <span class="text-dark fw-medium">권한관리</span>
            </div>
        </div>

        <b-card class="mgmt-card shadow-sm border-0">
            <!-- 검색 영역 -->
            <table class="search-table mb-4">
                <tr>
                    <th>권한명 검색</th>
                    <td>
                        <input type="text" class="form-control form-control-sm" style="width: 400px;" v-model="schAuthNm" placeholder="권한명을 입력하세요" @keyup.enter="fetchAuthors">
                    </td>
                </tr>
                <tr class="search-actions-row">
                    <td colspan="2">
                        <div class="d-flex justify-content-end p-2 gap-2">
                            <b-button variant="outline-secondary" size="sm" @click="resetSearch"><i class="bi bi-arrow-counterclockwise me-1"></i>초기화</b-button>
                            <b-button variant="primary" size="sm" @click="fetchAuthors"><i class="bi bi-search me-1"></i>검색</b-button>
                        </div>
                    </td>
                </tr>
            </table>

            <!-- Action Button -->
            <div class="mb-3">
                <b-button variant="primary" size="sm" @click="openModal"><i class="bi bi-pencil-square me-1"></i>등록</b-button>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">No</th>
                            <th>권한명</th>
                            <th style="width: 150px;">등록자</th>
                            <th style="width: 150px;">등록일</th>
                            <th style="width: 150px;">액션</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(author, index) in authorList" :key="author.authorId">
                            <td>{{ totCnt - index }}</td>
                            <td class="text-start px-4">{{ author.authorNm }}</td>
                            <td>{{ author.registerNm }}</td>
                            <td>{{ author.registYmd }}</td>
                             <td>
                                <b-button variant="outline-primary" size="sm" class="me-1" @click="editAuthor(author)">수정</b-button>
                                <b-button variant="outline-danger" size="sm" @click="deleteAuthor(author.authorId)">삭제</b-button>
                            </td>
                        </tr>
                        <tr v-if="authorList.length === 0">
                            <td colspan="5" class="text-center py-5 text-muted">등록된 권한이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        </b-card>

        <!-- Author Modal -->
        <b-modal id="authorModal" v-model="showModal" :title="modalTitle" @ok="saveAuthor">
            <div class="mb-3">
                <label class="form-label">권한 ID</label>
                <b-form-input v-model="form.authorId" :readonly="isEdit" placeholder="예: ROLE_ADMIN"></b-form-input>
            </div>
            <div class="mb-3">
                <label class="form-label">권한명</label>
                <b-form-input v-model="form.authorNm" required></b-form-input>
            </div>
            <div class="mb-3">
                <label class="form-label">비고</label>
                <b-form-textarea v-model="form.rm" rows="3"></b-form-textarea>
            </div>
            <template #footer="{ ok, cancel }">
                <b-button variant="secondary" size="sm" @click="cancel">취소</b-button>
                <b-button variant="primary" size="sm" @click="ok">저장</b-button>
            </template>
        </b-modal>
    </div>

    <div id="admin-author-script">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const authorList = ref([]);
                    const totCnt = ref(0);
                    const schAuthNm = ref('');
                    const loading = ref(true);
                    const showModal = ref(false);
                    const form = ref({ authorId: '', authorNm: '', rm: '' });
                    const modalTitle = ref('권한 등록');
                    const isEdit = ref(false);

                    const fetchAuthors = () => {
                        loading.value = true;
                        axios.get('/api/admin/author', { params: { schAuthNm: schAuthNm.value } })
                            .then(res => {
                                authorList.value = res.data.list;
                                totCnt.value = res.data.totCnt;
                            })
                            .catch(err => alert('권한 조회 실패'))
                            .finally(() => loading.value = false);
                    };

                    const openModal = () => {
                        isEdit.value = false;
                        form.value = { authorId: '', authorNm: '', rm: '' };
                        modalTitle.value = '권한 등록';
                        showModal.value = true;
                    };

                    const editAuthor = (author) => {
                        isEdit.value = true;
                        form.value = { ...author };
                        modalTitle.value = '권한 수정';
                        showModal.value = true;
                    };

                    const saveAuthor = () => {
                        if (isEdit.value) {
                            axios.put('/api/admin/author', form.value)
                                .then(res => {
                                    alert(res.data);
                                    showModal.value = false;
                                    fetchAuthors();
                                })
                                .catch(err => AdminUtil.handleApiError(err, '저장 실패'));
                        } else {
                            axios.post('/api/admin/author', form.value)
                                .then(res => {
                                    alert(res.data);
                                    showModal.value = false;
                                    fetchAuthors();
                                })
                                .catch(err => AdminUtil.handleApiError(err, '저장 실패'));
                        }
                    };

                    const deleteAuthor = (authorId) => {
                        if (confirm('삭제하시겠습니까?')) {
                            axios.delete(`/api/admin/author/${authorId}`)
                                .then(res => {
                                    alert(res.data);
                                    fetchAuthors();
                                })
                                .catch(err => alert('삭제 실패'));
                        }
                    };

                    const resetSearch = () => {
                        schAuthNm.value = '';
                        fetchAuthors();
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchAuthors();
                    });

                    return { authorList, totCnt, schAuthNm, loading, form, modalTitle, isEdit, showModal, openModal, editAuthor, saveAuthor, deleteAuthor, fetchAuthors, resetSearch };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
