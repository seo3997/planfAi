<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::#admin-author-content}, ~{::#admin-author-script}, ~{::#admin-author-head})}">
<head>
    <title>권한 관리 - PlanfAi 관리자</title>
    <th:block id="admin-author-head">
    </th:block>
</head>
<body>
    <div id="admin-author-content">
        <div class="page-title-box">
            <h2 class="page-title">권한관리</h2>
            <div class="breadcrumb-area">
                <i class="bi bi-house-door"></i> > 시스템 > <span class="text-dark fw-medium">권한관리</span>
            </div>
        </div>

        <div class="mgmt-card">
            <!-- 검색 영역 -->
            <!-- Search Area (Refactored to Div-based) -->
            <div class="search-filter-box">
                <div class="filter-row">
                    <div class="filter-item" style="flex: 0 0 100%; max-width: 100%;">
                        <div class="filter-label">권한명 검색</div>
                        <div class="filter-content">
                            <input type="text" class="form-control form-control-sm" v-model="schAuthNm" placeholder="권한명을 입력하세요" @keyup.enter="fetchAuthors">
                        </div>
                    </div>
                </div>
                
                <div class="search-filter-actions">
                    <button class="btn btn-sm btn-reset d-flex align-items-center justify-content-center gap-1" @click="resetSearch">
                        <i class="bi bi-arrow-counterclockwise"></i> 초기화
                    </button>
                    <button class="btn btn-sm btn-search d-flex align-items-center justify-content-center gap-1" @click="fetchAuthors">
                        <i class="bi bi-search"></i> 검색
                    </button>
                </div>
            </div>

            <!-- Action Button -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="text-muted fs-7">
                    검색결과 <span class="text-primary fw-bold">{{ totCnt }}</span>개
                </div>
                <button class="btn btn-sm btn-primary" @click="goRegister">
                    <i class="bi bi-pencil-square"></i> 등록
                </button>
            </div>

            <div class="data-table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">No</th>
                            <th>권한명</th>
                            <th style="width: 150px;">등록자</th>
                            <th style="width: 150px;">등록일</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(author, index) in authorList" :key="author.authorId" @click="goDetail(author.authorId)" style="cursor: pointer;">
                            <td>{{ totCnt - index }}</td>
                            <td class="text-start px-4">{{ author.authorNm }}</td>
                            <td>{{ author.registerNm }}</td>
                            <td>{{ author.registYmd }}</td>
                        </tr>
                        <tr v-if="authorList.length === 0">
                            <td colspan="4" class="text-center py-5 text-muted">등록된 권한이 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal Removed -->
    </div>

    <div id="admin-author-script">
        <script>
            const initVueApp = true;
            const { createApp, ref, onMounted } = Vue;
            const app = createApp({
                setup() {
                    const authorList = ref([]);
                    const totCnt = ref(0);
                    const schAuthNm = ref('');
                    const loading = ref(true);
                    const showModal = ref(false);
                    const form = ref({ authorId: '', authorNm: '', rm: '' });
                    const modalTitle = ref('권한 등록');
                    const isEdit = ref(false);

                    const fetchAuthors = () => {
                        loading.value = true;
                        axios.get('/api/admin/author', { params: { schAuthNm: schAuthNm.value } })
                            .then(res => {
                                authorList.value = res.data.list;
                                totCnt.value = res.data.totCnt;
                            })
                            .catch(err => alert('권한 조회 실패'))
                            .finally(() => loading.value = false);
                    };

                    const goRegister = () => {
                        window.location.href = '/admin/author/insertFormAuthorMgt.do';
                    };

                    const goDetail = (authorId) => {
                        window.location.href = `/admin/author/updateFormAuthorMgt.do?authorId=${authorId}`;
                    };

                    const resetSearch = () => {
                        schAuthNm.value = '';
                        fetchAuthors();
                    };

                    onMounted(() => {
                        AdminMenu.init();
                        fetchAuthors();
                    });

                    return { authorList, totCnt, schAuthNm, loading, goDetail, goRegister, fetchAuthors, resetSearch };
                }
            });
            AdminLayout.register(app);
            app.mount('#app');
        </script>
    </div>
</body>
</html>
