<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${survey.surveyTitle}">설문 참여</title>
    
    <!-- CSS -->
    <link href="/common/lib/css/bootstrap.min.css" rel="stylesheet">
    <link href="/common/lib/css/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="/common/lib/js/vue.global.js"></script>
    <script src="/common/lib/js/axios.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map-container { height: 400px; width: 100%; border-radius: 8px; }
        .map-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
        .map-modal.show { display: flex; }
        .map-modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 800px; }
        
        body {
            background-color: #f8f9fa;
            transition: background-color 0.3s ease;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .survey-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            width: 100%;
        }
        .survey-container {
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex-grow: 1;
            transition: all 0.3s ease;
        }
        
        body.has-bg .survey-container {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
        }
        
        .survey-header { margin-bottom: 40px; }
        .logo-area { margin-bottom: 30px; display: flex; }
        .logo-area.align-LEFT { justify-content: flex-start; }
        .logo-area.align-CENTER { justify-content: center; }
        .logo-area.align-RIGHT { justify-content: flex-end; }
        .logo-img { max-height: 60px; }

        .question-box { margin-bottom: 40px; }
        .question-title {
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 1.35rem;
            color: inherit;
            letter-spacing: -0.02em;
        }
        .question-desc {
            font-size: 1rem;
            opacity: 0.6;
            margin-bottom: 18px;
            color: inherit !important;
            line-height: 1.6;
        }
        
        .form-check {
            padding: 12px 12px 12px 3em;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(0,0,0,0.05);
            background-color: rgba(255,255,255,0.5);
            transition: all 0.2s ease;
            position: relative;
        }
        .form-check:hover {
            background-color: rgba(255,255,255,0.8);
            border-color: rgba(0,0,0,0.1);
            transform: translateY(-1px);
        }
        .form-check-input { 
            cursor: pointer; 
            width: 1.25em;
            height: 1.25em;
            margin-top: 0.125em;
            margin-left: -2.2em; /* Adjusted for 3em padding */
        }
        .form-check-label { cursor: pointer; width: 100%; font-weight: 500; line-height: 1.5; }
        
        .other-input-group {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 8px;
        }
        .other-text-input {
            border: none;
            border-bottom: 2px solid #dee2e6;
            background: transparent !important;
            padding: 0px 4px;
            flex-grow: 1;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            outline: none;
        }
        .other-text-input:focus {
            border-bottom-color: var(--accent-color, #2b4b8a);
        }
        .other-text-input:disabled {
            border-bottom-color: #eee;
            opacity: 0.5;
        }
        
        /* Layouts */
        .layout-center { max-width: 800px; margin: 50px auto; border-radius: 24px; }
        .layout-top_banner { max-width: 1000px; margin: 50px auto; border-radius: 24px; }
        .layout-left_1_3, .layout-right_1_2 { max-width: 1200px; display: flex; gap: 40px; margin: 50px auto; background-color: transparent !important; box-shadow: none !important; border: none !important; }
        .layout-right_1_2 { flex-direction: row-reverse; }
        .layout-sidebar { width: 320px; padding: 40px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); height: fit-content; border: 1px solid #e9ecef; }
        .layout-main { flex-grow: 1; padding: 40px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); border: 1px solid #e9ecef; }

        .btn-submit { padding: 16px 48px; border-radius: 14px; font-weight: 800; font-size: 1.2rem; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-submit:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .border-dashed { border-style: dashed !important; border-width: 2px !important; }
        .anim-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Success Page Overlay */
        .success-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; z-index: 10000; display:flex; align-items:center; justify-content:center; text-align:center; flex-direction:column; padding: 20px; }

        @media (max-width: 1100px) {
            .layout-left_1_3, .layout-right_1_2 { flex-direction: column; padding: 0 20px !important; }
            .layout-sidebar, .layout-main { width: 100%; padding: 30px; }
        }
    </style>
</head>
<body>
    <div id="app" class="survey-wrapper" :style="rootStyle">
        
        <!-- Participation UI -->
        <div v-if="!isSubmitted" class="survey-container" :class="'layout-' + (survey.layoutType || 'center').toLowerCase()" :style="containerStyle">
            
            <div :class="isSidebarLayout ? 'layout-sidebar' : ''" :style="isSidebarLayout ? containerStyle : {}">
                <div v-if="survey.logoImagePath" class="logo-area" :class="'align-' + survey.logoAlign">
                    <img :src="survey.logoImagePath" class="logo-img" alt="Logo">
                </div>
                <div v-if="survey.header" v-html="survey.header" class="mb-4"></div>
                <div class="survey-header" v-if="survey.surveyTitle" :class="{'text-center': !isSidebarLayout}">
                    <h1 class="mb-3 fw-bold">{{ survey.surveyTitle }}</h1>
                    <p v-if="survey.numberRoductionText" class="text-muted fs-5">{{ survey.numberRoductionText }}</p>
                </div>
            </div>

            <div :class="isSidebarLayout ? 'layout-main' : ''" :style="isSidebarLayout ? containerStyle : {}">
                <form @submit.prevent="submitSurvey">
                    <div v-for="(section, sIdx) in survey.sections" :key="sIdx" class="mb-5 anim-fade-in" :style="{animationDelay: (sIdx * 0.1) + 's'}">
                        <h3 v-if="section.sectionTitle" class="mb-4 pb-2 border-bottom fw-bold" :style="{color: survey.accentColor || '#0d6efd', borderBottom: '2px solid ' + (survey.accentColor || '#0d6efd' ) + '33'}">{{ section.sectionTitle }}</h3>
                        <div v-if="section.sectionHtmlTitle" v-html="section.sectionHtmlTitle" class="mb-3"></div>

                        <div v-for="(question, qIdx) in section.questions" :key="qIdx" class="question-box card border-0 shadow-none bg-transparent mb-5">
                            <div class="card-body p-0">
                                <div class="question-title d-flex align-items-baseline">
                                    <span class="text-muted opacity-50 me-2 fs-5 fw-normal" v-if="survey.sections.length > 1">Q{{ sIdx + 1 }}-{{ qIdx + 1 }}.</span>
                                    <span class="text-muted opacity-50 me-2 fs-5 fw-normal" v-else>Q{{ qIdx + 1 }}.</span>
                                    <span>{{ question.questionText }}</span>
                                    <span v-if="question.required === 'Y'" class="text-danger ms-1">*</span>
                                </div>
                                
                                <div class="mt-2">
                                     <!-- Radio -->
                                     <div v-if="question.questionType === 'inputRadio'" :class="question.questionLayout === 'horizontal' ? 'd-flex flex-wrap gap-3' : ''">
                                        <div v-for="label in question.labels" :key="label.questionLabelId" class="form-check">
                                            <input class="form-check-input" type="radio" :name="'q_'+question.questionId" :id="'l_'+label.questionLabelId" :value="label.questionLabelId" v-model="answers[question.questionId]">
                                            <label class="form-check-label" :for="'l_'+label.questionLabelId">{{ label.questionLabel }}</label>
                                        </div>
                                        <!-- Other (Radio) -->
                                        <div v-if="question.otherAnswer === 'Y'" class="form-check d-flex align-items-center">
                                            <div class="other-input-group">
                                                <input class="form-check-input" type="radio" value="OTHER" v-model="answers[question.questionId]" :id="'q_'+question.questionId+'_other_radio'">
                                                <label class="form-check-label w-auto mb-0" :for="'q_'+question.questionId+'_other_radio'" style="white-space: nowrap;">기타:</label>
                                                <input type="text" class="other-text-input" 
                                                       v-model="answers[question.questionId + '_other']" 
                                                       :disabled="answers[question.questionId] !== 'OTHER'"
                                                       placeholder="내용을 입력하세요"
                                                       :style="{'--accent-color': survey.accentColor}">
                                            </div>
                                        </div>
                                     </div>

                                     <!-- Checkbox -->
                                     <div v-if="question.questionType === 'inputCheckbox'" :class="question.questionLayout === 'horizontal' ? 'd-flex flex-wrap gap-3' : ''">
                                        <div v-for="label in question.labels" :key="label.questionLabelId" class="form-check">
                                            <input class="form-check-input" type="checkbox" :id="'l_'+label.questionLabelId" :value="label.questionLabelId" v-model="answers[question.questionId]">
                                            <label class="form-check-label" :for="'l_'+label.questionLabelId">{{ label.questionLabel }}</label>
                                        </div>
                                        <!-- Other (Checkbox) -->
                                        <div v-if="question.otherAnswer === 'Y'" class="form-check d-flex align-items-center">
                                            <div class="other-input-group">
                                                <input class="form-check-input" type="checkbox" value="OTHER" v-model="answers[question.questionId]" :id="'q_'+question.questionId+'_other_check'">
                                                <label class="form-check-label w-auto mb-0" :for="'q_'+question.questionId+'_other_check'" style="white-space: nowrap;">기타:</label>
                                                <input type="text" class="other-text-input" 
                                                       v-model="answers[question.questionId + '_other']" 
                                                       :disabled="!answers[question.questionId].includes('OTHER')"
                                                       placeholder="내용을 입력하세요"
                                                       :style="{'--accent-color': survey.accentColor}">
                                            </div>
                                        </div>
                                     </div>

                                     <!-- Text -->
                                     <input v-if="question.questionType === 'inputTextline'" type="text" class="form-control form-control-lg bg-white shadow-sm" v-model="answers[question.questionId]" :placeholder="question.questionText + ' 내용을 입력해주세요.'" :maxlength="question.maxLength">
                                     <textarea v-if="question.questionType === 'inputTextarea'" class="form-control shadow-sm" :rows="question.textRows || 4" v-model="answers[question.questionId]" placeholder="자세한 내용을 입력해주세요." :maxlength="question.maxLength"></textarea>

                                     <!-- Location -->
                                     <div v-if="question.questionType === 'inputLocation'">
                                         <div class="row g-2 mb-2">
                                             <div class="col-6"><input type="text" class="form-control bg-light" v-model="answers[question.questionId].lat" placeholder="위도" readonly></div>
                                             <div class="col-6"><input type="text" class="form-control bg-light" v-model="answers[question.questionId].lng" placeholder="경도" readonly></div>
                                         </div>
                                         <button type="button" class="btn btn-outline-primary w-100 py-2" @click="openMap(question.questionId)">
                                             <i class="bi bi-geo-alt-fill me-1"></i> 지도에서 위치 지정하기
                                         </button>
                                     </div>

                                     <!-- Image -->
                                     <div v-if="question.questionType === 'inputImage'">
                                         <div class="d-grid shadow-sm rounded-3">
                                             <label class="btn btn-outline-secondary py-4 border-dashed bg-white" :class="{'border-success text-success': uploadedImages[question.questionId]}">
                                                 <input type="file" class="d-none" accept="image/*" @change="handleImageUpload($event, question.questionId)">
                                                 <div class="d-flex flex-column align-items-center">
                                                     <i v-if="!uploadedImages[question.questionId]" class="bi bi-cloud-upload fs-1 mb-2"></i>
                                                     <i v-else class="bi bi-check-circle-fill fs-1 mb-2"></i>
                                                     <span class="fw-bold">{{ isUploading[question.questionId] ? '업로드 중...' : (uploadedImages[question.questionId] ? '이미지 업로드 완료' : '이미지 선택 및 업로드') }}</span>
                                                     <span class="small opacity-50">PNG, JPG, GIF 지원</span>
                                                 </div>
                                             </label>
                                         </div>
                                         <div v-if="uploadedImages[question.questionId]" class="mt-3 text-center anim-fade-in position-relative">
                                             <img :src="uploadedImages[question.questionId]" class="img-fluid rounded-3 shadow border" style="max-height: 250px;">
                                             <button type="button" class="btn btn-danger btn-sm position-absolute top-0 start-100 translate-middle rounded-circle shadow" @click="removeImage(question.questionId)">
                                                 <i class="bi bi-x fs-5"></i>
                                             </button>
                                         </div>
                                     </div>

                                     <!-- Comment -->
                                     <div v-if="question.questionType === 'inputComment'" class="p-3 bg-light border-start border-4 border-primary rounded-end shadow-sm" v-html="question.questionText"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-5 mb-5 pb-5">
                        <button type="submit" class="btn btn-primary btn-submit shadow-lg border-0" :style="accentButtonStyle" :disabled="isSubmitting">
                            <span v-if="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                            {{ isSubmitting ? '제출 처리 중...' : '설문 제출하기' }}
                        </button>
                    </div>
                </form>

                <div v-if="survey.footer" v-html="survey.footer" class="mt-5 border-top pt-4 text-center opacity-75"></div>
                <div v-if="survey.showFooterLogo === 'Y'" class="text-center mt-4">
                    <img src="/admin/images/logo_icon.png" alt="PlanfAi" style="height: 24px; opacity: 0.4;">
                    <p class="small text-muted mb-0">Powered by PlanfAi</p>
                </div>
            </div>
        </div>

        <!-- Success Message -->
        <div v-if="isSubmitted" class="success-overlay anim-fade-in">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            </div>
            <h1 class="fw-bold mb-3">설문이 정상적으로 제출되었습니다.</h1>
            <div v-if="survey.exitPageText" class="fs-5 text-muted mb-5" :class="{'lh-lg': survey.exitPageTextIsHtml === 'Y'}">
                <div v-if="survey.exitPageTextIsHtml === 'Y'" v-html="survey.exitPageText"></div>
                <div v-else style="white-space: pre-wrap;">{{ survey.exitPageText }}</div>
            </div>
            <div v-else class="fs-5 text-muted mb-5">귀한 시간 내어 주셔서 진심으로 감사드립니다.</div>
            <button class="btn btn-outline-secondary btn-lg rounded-pill px-5" @click="window.close()">창 닫기</button>
        </div>

        <!-- Map Modal -->
        <div class="map-modal" :class="{'show': mapModal.show}" @click.self="closeMap">
            <div class="map-modal-content anim-fade-in shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="m-0 fw-bold">지도에서 위치 선택</h5>
                    <button type="button" class="btn-close" @click="closeMap"></button>
                </div>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" v-model="mapSearchKeyword" placeholder="주소를 입력하세요" @keyup.enter="searchAddress">
                    <button class="btn btn-primary" @click="searchAddress"><i class="bi bi-search"></i></button>
                </div>
                <div id="map-container"></div>
                <div class="mt-3 text-end">
                    <button class="btn btn-secondary me-2" @click="closeMap">취소</button>
                    <button class="btn btn-primary px-4" @click="confirmLocation">위치 확정</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const serverSurvey = /*[[${survey}]]*/ {};
        /*]]>*/

        const { createApp, ref, onMounted, computed } = Vue;
        createApp({
            setup() {
                const survey = ref(serverSurvey);
                const answers = ref({});
                const isSubmitting = ref(false);
                const isSubmitted = ref(false);
                const uploadedImages = ref({});
                const isUploading = ref({});
                
                const rootStyle = ref({});
                const containerStyle = ref({});
                const accentButtonStyle = ref({});

                const isSidebarLayout = computed(() => ['LEFT_1_3', 'RIGHT_1_2'].includes(survey.value.layoutType));

                // Init styles logic (same as preview)
                if(survey.value.bgImagePath) {
                    document.body.style.backgroundImage = `url('${survey.value.bgImagePath}')`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundAttachment = 'fixed';
                    document.body.classList.add('has-bg');
                }
                if(survey.value.bgColor) containerStyle.value.backgroundColor = survey.value.bgColor;
                if(survey.value.textColor) {
                    rootStyle.value.color = survey.value.textColor;
                    containerStyle.value.color = survey.value.textColor;
                }
                if(survey.value.accentColor) {
                    accentButtonStyle.value.backgroundColor = survey.value.accentColor;
                    accentButtonStyle.value.borderColor = survey.value.accentColor;
                }
                if(survey.value.fontFamily) document.body.style.fontFamily = survey.value.fontFamily;

                // Init answer state
                survey.value.sections?.forEach(s => s.questions?.forEach(q => {
                    if (q.questionType === 'inputCheckbox') answers.value[q.questionId] = [];
                    else if (q.questionType === 'inputLocation') answers.value[q.questionId] = { lat: '', lng: '' };
                    else answers.value[q.questionId] = '';
                }));

                const handleImageUpload = async (event, qId) => {
                    const file = event.target.files[0];
                    if(!file) return;
                    
                    isUploading.value[qId] = true;
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    try {
                        const res = await axios.post('/survey/upload-image?surveyId=' + survey.value.surveyId, formData);
                        if(res.data.status === 'success') {
                            uploadedImages.value[qId] = res.data.fullUrl;
                            answers.value[qId] = res.data.filePath; // Store path for submission
                        } else alert(res.data.message);
                    } catch(e) { alert('이미지 업로드 실패'); }
                    finally { isUploading.value[qId] = false; }
                };

                const removeImage = (qId) => {
                    uploadedImages.value[qId] = null;
                    answers.value[qId] = '';
                };

                const mapModal = ref({ show: false, qId: null, lat: 37.5665, lng: 126.9780 });
                const mapSearchKeyword = ref('');
                let lMap, lMarker;

                const openMap = (qId) => {
                    mapModal.value.qId = qId;
                    mapModal.value.show = true;
                    setTimeout(() => {
                        if(!lMap) {
                            lMap = L.map('map-container').setView([37.5665, 126.9780], 13);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(lMap);
                            lMarker = L.marker([37.5665, 126.9780], {draggable:true}).addTo(lMap);
                        }
                        lMap.invalidateSize();
                    }, 100);
                };

                const confirmLocation = () => {
                    const pos = lMarker.getLatLng();
                    answers.value[mapModal.value.qId] = { lat: pos.lat.toFixed(6), lng: pos.lng.toFixed(6) };
                    mapModal.value.show = false;
                };

                const searchAddress = async () => {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${mapSearchKeyword.value}`);
                    const data = await res.json();
                    if(data?.[0]) lMap.setView([data[0].lat, data[0].lon], 15), lMarker.setLatLng([data[0].lat, data[0].lon]);
                };

                const submitSurvey = async () => {
                    if(isSubmitting.value) return;
                    
                    // Validation
                    for(let s of survey.value.sections) {
                        for(let q of s.questions) {
                            if(q.required === 'Y') {
                                let val = answers.value[q.questionId];
                                if(!val || (Array.isArray(val) && val.length === 0) || (q.questionType === 'inputLocation' && !val.lat)) {
                                    alert(`'${q.questionText}' 문항은 필수 항목입니다.`);
                                    return;
                                }
                            }
                        }
                    }

                    if(!confirm('작성하신 내용으로 설문을 제출하시겠습니까?')) return;

                    isSubmitting.value = true;
                    const finalAnswers = [];
                    survey.value.sections.forEach(s => s.questions.forEach(q => {
                        let resText = answers.value[q.questionId];
                        let labelIds = null;
                        let otherText = answers.value[q.questionId + '_other'];

                        if(q.questionType === 'inputCheckbox') {
                            labelIds = answers.value[q.questionId].filter(v => v !== 'OTHER');
                            resText = answers.value[q.questionId].includes('OTHER') ? 'OTHER' : (labelIds.length > 0 ? 'Y' : '');
                        } else if(q.questionType === 'inputRadio') {
                            if(resText === 'OTHER') labelIds = null;
                            else labelIds = [resText], resText = 'Y';
                        } else if(q.questionType === 'inputLocation') {
                            resText = `${resText.lat},${resText.lng}`;
                        }

                        finalAnswers.push({
                            sectionId: q.sectionId,
                            questionId: q.questionId,
                            questionType: q.questionType,
                            result: resText,
                            labelIds: labelIds,
                            otherResult: otherText
                        });
                    }));

                    try {
                        const res = await axios.post('/survey/submit', {
                            surveyId: survey.value.surveyId,
                            answers: finalAnswers
                        });
                        if(res.data.status === 'success') isSubmitted.value = true;
                        else alert(res.data.message);
                    } catch(e) { alert('제출 중 오류가 발생했습니다.'); }
                    finally { isSubmitting.value = false; }
                };

                return { 
                    survey, answers, isSubmitting, isSubmitted, uploadedImages, isUploading,
                    rootStyle, containerStyle, accentButtonStyle, isSidebarLayout,
                    handleImageUpload, removeImage, openMap, confirmLocation, searchAddress, submitSurvey,
                    mapModal, mapSearchKeyword, closeMap: () => mapModal.value.show = false
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
