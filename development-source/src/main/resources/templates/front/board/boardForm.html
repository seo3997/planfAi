<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 fw-bold text-primary">게시글 작성</h4>
                </div>
                <div class="card-body p-4">
                    <form id="boardForm" method="post" action="/front/board/insertBoard.do">

                        <div class="mb-4">
                            <label for="sj" class="form-label fw-semibold">제목</label>
                            <input type="text" class="form-control" id="sj" name="sj"
                                   placeholder="제목을 입력하세요" required>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="writer" class="form-label fw-semibold">작성자</label>
                                <input type="text" class="form-control" id="writer" name="writer" value="admin" readonly>
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">카테고리</label>
                                <select class="form-select" id="category" name="category">
                                    <option value="notice">공지사항</option>
                                    <option value="free">자유게시판</option>
                                    <option value="qna">Q&A</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="cn" class="form-label fw-semibold">내용</label>
                            <textarea class="form-control" id="cn" name="cn" rows="10"
                                      placeholder="내용을 상세히 입력해 주세요"></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-danger" onclick="history.back();">
                                취소
                            </button>
                            <button type="submit" class="btn btn-primary px-4" onclick="return validateForm();">
                                저장하기
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function validateForm() {
        const title = document.getElementById('sj').value;
        const content = document.getElementById('cn').value;

        if (!title.trim()) {
            alert("제목을 입력해주세요.");
            return false;
        }
        if (!content.trim()) {
            alert("내용을 입력해주세요.");
            return false;
        }
        return true;
    }
</script>

</body>
</html>
